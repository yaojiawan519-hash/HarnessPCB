project:
  kind: block
  name: power_3v3_usb_ldo
  version: sdi/1
defs:
  power_3v3_usb_ldo:
    category: power
    rationale: '**USB 取电 + 3.3V 稳压**（作者子页框 "3V3 Regulator"，副标题 "max. 200mA @ 3V3"）： USB VBUS → F1（100mA
      自恢复保险）→ FB1（100MHz 磁珠）→ U1 XC6206P332MR 低压差线性 稳压 → 3V3。C1/C2 各 10uF 分列输入/输出。 ⚠ 作者在框里写明选值理由：**USB
      宿主侧电容要压在 10uF 以内**，否则插上瞬间的浪涌会 超标（框外注释指向 TI slyt118）；两颗就是按这条选的，换成 22uF 会破坏这个约束。 ⚠ 作者自己也标了这级的短板：**没有反接保护**，理由是"唯一电源就是
      USB 口，赌它插不错"。 要用在会乱插线的场合，前面得自己加理想二极管或 PMOS。 ⚠ 100mA 保险对 200mA 的负载是**不够**的——这条是作者按他自己的用例（L432 + nRF24
      平均电流远低于额定）定的，搬到别的负载上要重算。'
    ports: []
    rails:
    - +3V3
    - +5V
    - GND
    parts:
    - ref: U1
      lib: Regulator_Linear:XC6206PxxxMR
      value: XC6206P332MR
      footprint: Package_TO_SOT_SMD:SOT-23
    - ref: C1
      lib: Device:C
      value: 10u
      footprint: Capacitor_SMD:C_0603_1608Metric
    - ref: C2
      lib: Device:C
      value: 10u
      footprint: Capacitor_SMD:C_0603_1608Metric
    - ref: FB1
      lib: Device:Ferrite_Bead
      value: 100 @ 100MHz
      footprint: Inductor_SMD:L_0805_2012Metric
    - ref: F1
      lib: Device:Fuse
      value: 100mA
      footprint: Fuse:Fuse_1206_3216Metric
    conns:
    - ref: C2
      pin: '1'
      net: +3V3
    - ref: U1
      pin: '2'
      net: +3V3
    - ref: F1
      pin: '2'
      net: +5V
    - ref: C1
      pin: '2'
      net: GND
    - ref: C2
      pin: '2'
      net: GND
    - ref: U1
      pin: '1'
      net: GND
    - ref: C1
      pin: '1'
      net: _power_3v3_usb_ldo_N1
    - ref: FB1
      pin: '1'
      net: _power_3v3_usb_ldo_N1
    - ref: U1
      pin: '3'
      net: _power_3v3_usb_ldo_N1
    - ref: F1
      pin: '1'
      net: _power_3v3_usb_ldo_N2
    - ref: FB1
      pin: '2'
      net: _power_3v3_usb_ldo_N2
    placement_prior:
      anchor: U1
      max_mm: 12.0
      rationale: 保险 F1 与磁珠 FB1 串在 USB 入口 → 稳压器的顺序不能改，三只沿进电路径排； C1 贴 U1 输入脚、C2 贴输出脚（作者原板就是这么摆的）。整块贴 USB
        座与负载之间。
    slots: []
    hot_loop: []
    internal_nets:
    - _power_3v3_usb_ldo_N1
    - _power_3v3_usb_ldo_N2
    provenance:
      source: human:open-source
      basis: 从 Phil's Lab STRF 2.4GHz RF-to-USB 加密狗的 `STRF.kicad_sch` 作者分区框 "3V3 Regulator" 整框裁出；板从同一工程
        `STRF_2layer.kicad_pcb` 按位号原样扣铜 （只做平移 + 删死铜 + 删整板铺铜）。
      board: STRF (2.4GHz RF-to-USB dongle)
      license: MIT — 上游 Copyright (c) 2020 Philip Salmony
      license_tier: permissive
      author: Philip Salmony（上游）/ HarnessPCB（裁块）
      date: '2026-10-31'
      kicad: 10.0.5
    geometry_status: carved 2026-10-31 kicad 10.0.5。PCB 从 `STRF.kicad_pcb` 原样扣；源板声明 4 层、 实际中间层只有 1 段 GND，先经
      `specs/_pcb_strf_2layer.py` **无损收成 2 层** （删 5 张铺铜 + 那 1 段 GND，断言中间层空后 `SetCopperLayerCount(2)`），
      收到 `STRF_2layer.kicad_pcb`（39 封装 / 50 网 / 415 段 + 70 孔 / 0 铺铜）。 本块：5 件 / 5 网，铜 39 段 + 1 孔，口岸切口 1
      处，孤立铜删 3 段； GND 裂 2 岛（铺铜删掉的必然结果，拼板重铺接回）。 1 处信号借道**块外**焊盘换层（`+5V → J1.1`，那孔不在块里，块单看是断的，拼板插上就通）。
