project:
  kind: block
  name: bp5_switchable_pullups
  version: sdi/1
defs:
  bp5_switchable_pullups:
    category: io
    rationale: '**8 路可开关上拉**：8 只 SI2301 P-MOS（Q300–Q307）栅极并联到 PULLUP_EN，源极全接 VREF_VOUT，漏极各经 RN311/RN312
      的 10K 接到 BPIO0–7。PULLUP_EN 拉低 → 8 根扩展线各挂 一个 10K 上拉到 VREF_VOUT；拉高 → 上拉全撤。R313(10K) 是栅极上拉到 +VUSB 的默认关断电阻。
      ⚠ 用的基准是 **VREF_VOUT 不是 +3V3**——它是模拟基准（后面 16:1 开关也拿它当量程）， 换成 3V3 会让"上拉"变成"拉偏基准"，换料/移植时最容易错的一处。 ⚠
      8 只 MOS 是 8 个独立单元（同型号不同位号），不是排阻式的共用体：可以只装一部分， 空着的 BPIO 就真的没有上拉（作者没留跳线，靠装料决定）。'
    ports:
    - name: BPIO0
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN312-1
        connector: false
    - name: BPIO1
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN312-2
        connector: false
    - name: BPIO2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN312-3
        connector: false
    - name: BPIO3
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN312-4
        connector: false
    - name: BPIO4
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN311-1
        connector: false
    - name: BPIO5
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN311-2
        connector: false
    - name: BPIO6
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN311-3
        connector: false
    - name: BPIO7
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN311-4
        connector: false
    - name: PULLUP_EN
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: Q300-1
        connector: false
    - name: VREF_VOUT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: Q300-2
        connector: false
    rails:
    - +VUSB
    parts:
    - ref: RN311
      lib: dp-rarray:R_Array
      value: 10K
      footprint: Resistor_SMD:R_Array_Convex_4x0402
    - ref: Q300
      lib: Transistor_FET:BSS84
      value: SI2301
      footprint: Package_TO_SOT_SMD:SOT-523
    - ref: Q301
      lib: Transistor_FET:BSS84
      value: SI2301
      footprint: Package_TO_SOT_SMD:SOT-523
    - ref: Q302
      lib: Transistor_FET:BSS84
      value: SI2301
      footprint: Package_TO_SOT_SMD:SOT-523
