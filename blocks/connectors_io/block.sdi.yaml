project:
  kind: block
  name: connectors_io
  version: sdi/1
defs:
  connectors_io:
    category: interface
    rationale: UPduino 的全部对外接口：左排 J3、右排 J2 各 1×24 2.54mm 直插排针（间距 17.78mm， 正好是面包板两排的宽度），加 J4 1×02 的 5V
      供电座。42 个信号口岸就是 FPGA 的 IO 与电源控制脚原样引到排针；三颗 DNI 电容 C23/C33/C34 是**留空的备用去耦位** （只在图纸上占位，装配不装），其中一个 C23
      挂在 VIO_BANK_0_2 上—— 改银行电压时这里才是要补电容的地方。 复用要点：这块的"电路"几乎没有（就是排针），价值全在**几何**：两排 2.54mm 栅格、 间距 17.78、以及块宽
      62.05mm = 整板宽。要换排针数量，等于重画这块。
