project:
  kind: block
  name: bp5_lcd_display
  version: sdi/1
defs:
  bp5_lcd_display:
    category: display
    rationale: '**2.0 寸并口/SPI IPS 屏 + 背光开关**：LCD201 是焊接式 FPC 屏（SPI_CLK/SPI_CDO/DISPLAY_CS/ DISPLAY_DP/DISPLAY_RESET
      由 RP2040 直接驱动）。背光 LED-A 直接接 +VUSB，LED-K 经 R209(33R) 到 Q202（MMBT7002K N-MOS）漏极，Q202 栅极经 R208(200R)
      由 595 的 DISPLAY_BACKLIGHT 控制—— **低边开关**，写 1 才亮。 ⚠ 作者批注「3 LEDs, 3.2Vf @ 20mA，30R 限流，R209 最小 0805」。⚠
      **按 3 串 3.2V=9.6V 算 5V 根本点不亮**，说明这块屏的背光是并/串混接——装料前必须按实物量，别照批注算电阻。 ⚠ 屏的 1/5/6/12 四只脚在符号里是**隐藏的 power_in
      脚**（都叫 GND）：图上只画了脚 1， 按几何算另外三只会浮空，而 kicad-cli 网表把它们全并进 GND。IL 侧为此补了"隐藏电源脚" 规则（`geom.lib_hidden_power`），否则"图↔板同一电路"门会红。
      ⚠ 屏占板面一大块（块框 50.8×36.5mm 几乎就是屏的轮廓），中间是开窗不是空白。'
    ports:
    - name: DISPLAY_BACKLIGHT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R208-1
        connector: false
    - name: DISPLAY_CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: LCD201-8
        connector: false
    - name: DISPLAY_DP
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: LCD201-7
        connector: false
    - name: DISPLAY_RESET
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: LCD201-11
        connector: false
    - name: SPI_CDO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: LCD201-10
        connector: false
    - name: SPI_CLK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: LCD201-9
        connector: false
    rails:
    - +3V3
    - +VUSB
    - GND
    parts:
    - ref: Q202
      lib: Transistor_FET:BSS138
      value: MMBT7002K
      footprint: Package_TO_SOT_SMD:SOT-23
    - ref: R209
      lib: Device:R_Small
      value: 33R
      footprint: Resistor_SMD:R_0805_2012Metric
    - ref: R208
      lib: Device:R_Small
      value: 200R
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: LCD201
      lib: dp-lcd:TFT_20_QT200H1201
      value: TFT_20_QT200H1201
      footprint: dp-lcd:TFT_20_QT200H1201
    conns:
    - ref: LCD201
      pin: '4'
      net: +3V3
    - ref: LCD201
      pin: '3'
      net: +VUSB
    - ref: R208
      pin: '1'
      net: DISPLAY_BACKLIGHT
    - ref: LCD201
      pin: '8'
      net: DISPLAY_CS
    - ref: LCD201
      pin: '7'
      net: DISPLAY_DP
    - ref: LCD201
      pin: '2'
      net: DISPLAY_LED-K
    - ref: R209
      pin: '2'
      net: DISPLAY_LED-K
    - ref: LCD201
      pin: '11'
      net: DISPLAY_RESET
    - ref: LCD201
      pin: '1'
      net: GND
    - ref: LCD201
      pin: '12'
      net: GND
    - ref: LCD201
      pin: '5'
      net: GND
    - ref: LCD201
      pin: '6'
      net: GND
    - ref: Q202
      pin: '2'
      net: GND
    - ref: LCD201
      pin: '10'
      net: SPI_CDO
    - ref: LCD201
      pin: '9'
      net: SPI_CLK
    - ref: Q202
      pin: '1'
      net: _bp5_lcd_display_N1
    - ref: R208
      pin: '2'
      net: _bp5_lcd_display_N1
    - ref: Q202
      pin: '3'
      net: _bp5_lcd_display_N2
    - ref: R209
      pin: '1'
      net: _bp5_lcd_display_N2
    placement_prior:
      anchor: board
      max_mm: 0
      rationale: 屏居中、FPC 焊盘朝板内便于引出；背光开关管与两只电阻贴屏的 LED-K 脚（大电流回路越短 越好）；数据线走屏的另一侧，避免和背光回路并行。
    slots: []
    hot_loop: []
    internal_nets:
    - DISPLAY_LED-K
    - _bp5_lcd_display_N1
    - _bp5_lcd_display_N2
    provenance:
      source: human:open-source
      basis: 从 Bus Pirate 5 主板 REV10A 的 `IO-expand-595-mux` 子页裁出，板从整板 `REV10a.kicad_pcb` 按位号原样扣铜（只做平移
        + 删死铜）。
      board: Bus Pirate 5 主板 REV10A（`bus_pirate_pcb/5-REV10A`）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
    geometry_status: schematic-only —— 只交了原理图，板级几何（摆放/布线/DRC）未做
