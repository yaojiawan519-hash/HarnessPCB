project:
  kind: block
  name: bp5_analog_mux
  version: sdi/1
defs:
  bp5_analog_mux:
    category: analog
    rationale: '**16:1 模拟开关 + 基准/输出钳位**：CD4067（U402）把 8 路 MUX_BPIO0–7（各经 RN400/RN401 510R 串阻）加 8 条固定通道选到
      AMUX_OUT。片选地址 AMUX_S0–S3 与使能 AMUX_EN 来自 595 那段 （S0 走串阻 R316，S1–S3 与 EN 走排阻 RN315）。另外三条固定通道：I8 经
      R320(510R) 到地、 I9/I10/I11 经 RN402 出去分别是 CURRENT_DETECT / VREG_OUT / MUX_VREF_VOUT。 MUX_VREF_VOUT
      由 U506（LMV321 开漏比较器）+ R319(100K) + D500 做基准钳位；AMUX_OUT 由 U404（LMV321 开漏）+ R406/R407 10K 分压引出。R402
      为 AMUX_EN 的上拉/串阻。 ⚠ 型号可换：作者批注 **74HC4067 或 74HCT4067 都行**（它由 5V 逻辑驱动），HC 通常更便宜。 ⚠ I12–I15（U402.16–19）全部接地、RN402
      第 3 组（脚 3/6）两头悬空 = **作者留的空位**， 按"只删不改"原样保留。 ⚠ **16:1 但只用了 12 路**：I0–I11 有用，I12–I15 接地，所以这块换 8:1/双
      4:1 时不能等量代换。'
