project:
  kind: block
  name: nrf24_transceiver
  version: sdi/1
defs:
  nrf24_transceiver:
    category: interface
    rationale: '**nRF24L01+ 2.4GHz 收发器本体**（作者分区框 "NRF24 Transceiver"）：U4 是 nRF24L01P（QFN20 + 散热盘=第 21
      脚），SPI3 四线由主控来、CE/IRQ 出到主控， 天线侧走 ANT1/ANT2 进匹配网络（另见 `nrf24_match_network`），VDD_PA 单独引到 匹配网络块去取电。去耦四颗都是贴脚摆的：C8
      10u/C9 10n/C10 10n/C11 10n 在 VDD 一排脚上，C12 33n 单独贴 VDD_PA。R4 22k 是 **IREF 参考电流电阻**——这颗芯片的 输出功率由它定，换值等于改发射功率，不是可随手替的"上拉"。
      ⚠ 散热盘（`U4.21`）在原理图符号里没有对应脚，只在封装里，板上接 GND； `pcbcarve` 的电路一致性门为此加了"符号里没有的焊盘不参与比较"（与既有的 "未上板的符号脚"对称，2026-10-31
      本块逼出来的）。'
    ports:
    - name: NRF_ANT1
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-12
        connector: false
    - name: NRF_ANT2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-13
        connector: false
    - name: NRF_CE
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-1
        connector: false
    - name: NRF_IRQ
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-6
        connector: false
    - name: NRF_VDD_PA
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-11
        connector: false
    - name: NRF_XC1
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-10
        connector: false
    - name: NRF_XC2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-9
        connector: false
    - name: SPI3_!CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-2
        connector: false
    - name: SPI3_MISO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-5
        connector: false
    - name: SPI3_MOSI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-4
        connector: false
    - name: SPI3_SCK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-3
        connector: false
    rails:
    - +3V3
    - GND
    parts:
    - ref: U4
      lib: RF:nRF24L01P
      value: nRF24L01P
      footprint: Package_DFN_QFN:QFN-20-1EP_4x4mm_P0.5mm_EP2.5x2.5mm
    - ref: R4
      lib: Device:R
      value: 22k
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: C12
      lib: Device:C
      value: 33n
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: C9
      lib: Device:C
      value: 10n
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: C10
      lib: Device:C
      value: 10n
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: C11
      lib: Device:C
