    placement_prior:
      anchor: U4
      max_mm: 12.0
      rationale: 四颗 VDD 去耦必须贴 U4 的 VDD 脚（源板就是这么摆的），C12 贴 VDD_PA 脚； R4 任意但别跨过 SPI 线。天线一侧（ANT1/ANT2/VDD_PA）朝板边，等匹配网络接。
