project:
  kind: block
  name: bp5_analog_buffers
  version: sdi/1
defs:
  bp5_analog_buffers:
    category: analog
    rationale: '**8 路模拟缓冲**：BPIO0–7 各经 100K（RN317/RN318）进一只 LMV324 跟随器（U504/U505 共 8 个 unit），输出改名为 MUX_BPIO0–7
      往下一块（16:1 开关）走。输入侧用 4 只 BAS40T-05 双二极管 （D501–D504）把 8 根线各钳到 +VUSB，超压时灌进 5V 轨而不是打穿运放；每只运放一只 100nF
      （C507–C510）去耦。 ⚠ 这块和 `bp5_analog_mux` 之间的切口水落在 **MUX_BPIO0–7** 这条 8 线总线上——这是真接口 不是臆造边界：缓冲段可以整体换增益/换运放，复用段可以换
      4051/4053，两边互不需要知道对方 怎么实现。作者把这两段写在一个标题下（"Analog multiplexer and buffer"），本轮拆两块， 标题文字留在 mux 那块（作者原话只写一次）。
      ⚠ 100K 输入电阻 + 高阻运放 = **这条路径只适合高阻测量**，别拿它驱动任何负载。'
