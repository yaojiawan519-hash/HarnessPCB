project:
  kind: block
  name: rs232_vout_led
  version: sdi/1
defs:
  rs232_vout_led:
    category: indicator
    rationale: '**VOUT 电源指示灯**：`VOUT — R2 2K — D2 阳极 — 阴极 — GND`（D2 = `Device:LED`， 脚 1=K 落地、脚 2=A 接 R2，中间那张网是
      `Net-(D2-A)`）。 板上这是左上角一对 0805，两块 RS232 通道块都不包含它——它只报"整板有没有电"。 复用要点：2K 在 5V 下 ≈1.5mA，够看；改 3.3V 也是这个电阻，不用动。'
    ports: []
    rails:
    - GND
    - VOUT
    parts:
    - ref: D2
      lib: Device:LED
      value: LED
      footprint: LED_SMD:LED_0805_2012Metric
    - ref: R2
      lib: Device:R
      value: 2K
      footprint: Resistor_SMD:R_0805_2012Metric
    conns:
    - ref: D2
      pin: '1'
      net: GND
    - ref: R2
      pin: '1'
      net: VOUT
    - ref: D2
      pin: '2'
      net: _rs232_vout_led_N1
    - ref: R2
      pin: '2'
      net: _rs232_vout_led_N1
    placement_prior: {}
    slots: []
    hot_loop: []
    internal_nets:
    - _rs232_vout_led_N1
    provenance:
      basis: 2 件 / 3 网 / 端口 0 + 轨 2；铜 3 段 + 0 孔；死铜删 0；口岸切口 1
      source: human:open-source
      board: Bus Pirate 5 RS232 双通道转接板 REV0
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
    geometry_status: extracted 2026-10-30 kicad 10.0.5（PCB 从 `rs232-dual-adapter.kicad_pcb` 的**位号修正副本**
      扣，见 `specs/_pcb_surgery_rs232.py`；块内 5 段铜 + 1 孔、0 铺铜）
    notes:
    - '**VOUT 电源指示灯**：`VOUT — R2 2K — D2 阳极 — 阴极 — GND`。2 件 / 3 网 / 端口 0 + 轨 2（GND、VOUT）。'
    - D2 是 `Device:LED`（脚 1=K 落地、脚 2=A 接 R2），中间那张无名网 `Net-(D2-A)` 是 R2.2+D2.2。2K 在 5V 下 ≈1.5mA，够看；换 3.3V
      也不用改电阻。
    - 这块**没有接插件：轨就是接口**——VOUT 与 GND 直接靠电源轨接进拼板。板上它只是左上角一对 0805，两块 RS232 通道块都不包含它。
