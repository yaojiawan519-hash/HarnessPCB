project:
  kind: block
  name: mcu_esp32s3
  version: sdi/1
defs:
  mcu_esp32s3:
    category: mcu
    rationale: ESP32-S3 的**裸芯片**最小系统（不是模块）：U4 是 QFN-56 带 5.6×5.6 散热盘，57 个脚里有 21 个空脚（本块只做基本外设，其余 GPIO/Flash
      脚空着）。两套时钟各一组：40MHz Y2 配 C16/C19（板上写 22pF）走 40M_P/40M_N，R12 是 1M 反馈电阻；32.768kHz Y1 配 C17/C18 （板上写
      18pF）走 32K_P/32K_N。**验收口径以原理图为准**：原理图上这几个电容写的是 26pF / 10pF，作者改了板上的 Value 没同步原理图，两边对不上，块里照原理图保留。
      C13 100nF + C15 1uF 是 VDD（内部 LDO 输出）的去耦，+3V3 直接进 4 个 VDD3P3 脚。 R1 10K + C2 1uF 是 EN 的 RC 延时（上电复位时序）。AE1
      是芯片天线，L1 + C7/C9 是 π 型匹配（板上 Value 写 TBD，说明作者是打样时按实测调的）。7 个测试点 TP1~TP7 把 TX/RX/BOOT/3V3/GND/SCL/SDA
      引出来——这是块对外的调试口，不是装饰。
    ports:
    - name: ACC_INT_1
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-19
        connector: false
      pin: U4/19
      note: 加速度计中断 1
    - name: ACC_INT_2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-18
        connector: false
      pin: U4/18
      note: 加速度计中断 2
    - name: ADC
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-14
        connector: false
      pin: U4/14
      note: 电池电压分压（分压电阻在电源块里）
    - name: BTN1
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-12
        connector: false
      pin: U4/12
      note: 按键 1（上拉在按键块里）
    - name: BTN2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-11
        connector: false
      pin: U4/11
      note: 按键 2，兼电源控制
    - name: BTN3
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: TP3-1
        connector: false
      pin: TP3/1
      note: 按键 3 / BOOT（TP3 在同一根网上）
    - name: BTN4
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-13
        connector: false
      pin: U4/13
      note: 按键 4
    - name: BUSY
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-41
        connector: false
      pin: U4/41
      note: 墨水屏忙信号
    - name: CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-38
        connector: false
      pin: U4/38
      note: 墨水屏片选
    - name: DC
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-39
        connector: false
      pin: U4/39
      note: 墨水屏数据/命令
    - name: EN
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: C2-1
        connector: false
      pin: C2/1
      note: 芯片使能，R1 10K + C2 1uF 做上电延时
    - name: MOSI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-36
        connector: false
      pin: U4/36
      note: 墨水屏 SPI 数据
    - name: RES
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-40
        connector: false
      pin: U4/40
      note: 墨水屏复位
    - name: SCK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-37
        connector: false
      pin: U4/37
      note: 墨水屏 SPI 时钟
    - name: SCL
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: TP6-1
        connector: false
      pin: TP6/1
      note: I2C 时钟（加速度计的线）
    - name: SDA
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: TP7-1
        connector: false
      pin: TP7/1
      note: I2C 数据
    - name: STAT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-15
        connector: false
      pin: U4/15
      note: 充电器状态输入
    - name: USB_D+
      kind: signal
      class: bus_diff
      direction: bidirectional
      diff_pair: USB_D-
      exit:
        pin: U4-26
        connector: false
      pin: U4/26
      note: USB D+（座子侧那一段在 usb_dev_esd 块里）
    - name: USB_D-
      kind: signal
      class: bus_diff
      direction: bidirectional
      diff_pair: USB_D+
      exit:
        pin: U4-25
        connector: false
      pin: U4/25
      note: USB D-（同 D+，两段网）
    - name: USB_DET
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-27
        connector: false
      pin: U4/27
      note: USB 插入检测，来自 VBUS 分压
    - name: VIB_PWM
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U4-23
        connector: false
      pin: U4/23
      note: 振动马达 PWM（低边开关在马达块里）
    rails:
    - +3V3
    - GND
