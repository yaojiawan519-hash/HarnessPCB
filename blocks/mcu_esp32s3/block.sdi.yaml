    placement_prior:
      anchor: U4
      max_mm: 22.0
      rationale: 去耦电容贴各自电源脚、晶振贴 XTAL 脚、天线匹配链贴 RF 脚并往板边走。源板实测： 去耦 C13/C15 离芯片中心 5.05/5.89mm、Y1 5.90mm、Y2
        7.15mm、天线 L1 5.68mm， 而 AE1 离 L1 14.56mm（天线本来就该在最外侧，中间是匹配元件）。
