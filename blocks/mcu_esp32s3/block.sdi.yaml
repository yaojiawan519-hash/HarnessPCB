    provenance:
      source: human:open-source
      board: Watchy
      license: MIT — 上游 Copyright (c) 2026 SQFMI
      license_tier: permissive
      author: SQFMI（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 23 件 / 33 网 / 端口 21 + 轨 2；铜 311 段 + 34 孔；死铜删 51；口岸切口 31；DRC isolated_copper 0；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 Watchy.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板的铺铜按"块内不带铺铜"整张删掉）'
    notes:
    - 23 件 / 33 网，21 个信号口岸 + 2 条轨；U4 的 21 个未用脚（GPIO/Flash 相关）按"空脚不是网"不写进卡。
    - ⚠ 电容值两处对不上：40MHz 的 C16/C19 板上写 22pF、原理图写 26pF；32.768kHz 的 C17/C18 板上写 18pF、原理图写 10pF。作者改了板没同步图，卡里按原理图记，复用时按晶振规格重新算（负载电容
      = 2×(CL - Cstray)）。
    - 天线链 AE1 + L1 + C7/C9 的 Value 在板上写的是 TBD——说明是打样后按实测调的，这块的天线匹配**不可照抄**，换板必须重配。
    - U4 散热盘（5.6×5.6mm）上压着 10 只 GND 缝合孔，删掉内层 GND 平面后它们只靠散热盘与块内铜连通（保留）。源板 In2 还有 49 段走线被保留，拼板时同样不能整层铺。
    - 源板自带的 DRC 违规在这里照搬：AE1(天线) 本体上的无网多边形与 Net-(AE1-FEED)、GND 走线相碰（clearance 3 条 + shorting 1 条）——是上游封装的老问题，不是裁块引入的。
