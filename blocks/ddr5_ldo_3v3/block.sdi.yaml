project:
  kind: block
  name: ddr5_ldo_3v3
  version: sdi/1
defs:
  ddr5_ldo_3v3:
    category: power
    rationale: '**5V → 3.3V 线性稳压**：U2 ME6206A33XG（SOT-23），VI(3)=BULK_VIN、VO(2)=+3.3V、GND(1)。 C4 10µF 在输入、C5
      10µF 在输出（都是 0805），R9 1K 挂在输出与地之间（≈3.3mA、11mW）—— 给这颗 LDO 一点最小负载，空载时输出更容易稳（ME6206 系列"要有最小负载"是民间经验，
      具体数值以所装芯片的 datasheet 为准）。 本块还带着页左上角那根**别名声明桩**（VOUT / +5V / BULK_VIN 三个名字挂在同一根短线上， 作者用它声明这三张网是同一张）：它不挂器件，所以簇判据带不走，靠
      `windows:` 圈进来。 复用要点：① 3.3V 在整页只喂 11 个脚（两颗插座各一根、U1 两脚、几颗上拉/指示灯）， 负载很小，但也**没有散热余量**——SOT-23 线性稳压的压差全变成热，输入电压越高越热；
      ② 输入 5V 由内存条那一侧（BULK_VIN）供给，本块不自带输入保护； ③ 换更大电流的 LDO 要连 C5 一起核（ME6206 稳定所需的容值与 ESR 窗口）。'
    ports: []
    rails:
    - +3.3V
    - BULK_VIN
    - GND
    parts:
    - ref: R9
      lib: Device:R
      value: 1K
      footprint: Resistor_SMD:R_0805_2012Metric
    - ref: U2
      lib: Regulator_Linear:MCP1700x-330xxTT
      value: ME6206A33XG
      footprint: Package_TO_SOT_SMD:SOT-23
    - ref: C4
      lib: Device:C
      value: 10uF/6.3V
      footprint: Capacitor_SMD:C_0805_2012Metric
    - ref: C5
      lib: Device:C
      value: 10uF/6.3V
      footprint: Capacitor_SMD:C_0805_2012Metric
    conns:
    - ref: C5
      pin: '1'
      net: +3.3V
    - ref: R9
      pin: '2'
      net: +3.3V
    - ref: U2
      pin: '2'
      net: +3.3V
    - ref: C4
      pin: '1'
      net: BULK_VIN
    - ref: U2
      pin: '3'
      net: BULK_VIN
    - ref: C4
      pin: '2'
      net: GND
    - ref: C5
      pin: '2'
      net: GND
    - ref: R9
      pin: '1'
      net: GND
    - ref: U2
      pin: '1'
      net: GND
    placement_prior:
      anchor: U2
      max_mm: 5.0
      rationale: 四件（LDO + 输入/输出电容 + 假负载）。规矩是**电容贴自己那一侧的脚**： C4 在 VI 边、C5 在 VO 边，R9 跟 C5 同侧；别把两颗 10µF 摆成一排挡在
        SOT-23 三个脚前面。
    slots: []
    hot_loop: []
    provenance:
      source: human:open-source
      board: Bus Pirate 5 DDR5 内存适配板（adapter-ram-ddr5-1REV2）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 4 件 / 3 网 / 端口 0 + 轨 3；铜 5 段 + 0 孔；死铜删 11；口岸切口 3；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 adapter-ram-ddr5-1REV2.kicad_pcb 原样扣，坐标
      = 源板坐标平移，origin: page；源板两张铺铜（GND 平面 + LDO 输出那一小片 +3.3V）按"块内不带铺铜"整张删掉，拼板时由整板铺铜接上）'
    notes:
    - '**5V → 3.3V 线性稳压**：U2 ME6206A33XG（SOT-23），VI(3)=BULK_VIN、VO(2)=+3.3V、GND(1)。4 件 / 3 网，**没有出块端口**——三张网全是轨，块的作用就是把
      5V 变成 3.3V。'
    - C4 10µF 在输入、C5 10µF 在输出（都 0805），R9 1K 挂在输出去地（≈3.3mA、11mW）当最小负载。ME6206 "要有最小负载"是民间经验，具体数值以所装芯片的 datasheet
      为准。
    - 3.3V 在整页只喂 11 个脚（两颗插座各一根、U1 两脚、几颗上拉/指示灯），负载很小，但也**没有散热余量**——SOT-23 线性稳压的压差全变成热，输入电压越高越热。
    - 本块当初还切了页左上角那根**别名声明桩**（三个电源名挂在同一根短线上，不挂器件，所以簇判据带不走，靠 `carve` 的 `windows:` 圈进来）；铺铜一张没留（源板那两片是GND
      平面和 +3.3V 的一小片，都属"平面网"，按约定整张删、拼板时重铺）。
    - ⚠ 网名：本板的 5V 供电在**页上有三个名字**（`BULK_VIN` 全局标签 / `+5V` 电源符号 / `VOUT` 全局标签），kicad-cli 把它们当同一张网、名取 `BULK_VIN`；卡里的网名一律用
      `BULK_VIN`，而块内原理图上剩的可能是其中另一个名字——同一个网，不是两根轨。
    - 铜 5 段 + 0 孔（F 13）；死铜删 11 段/孔；口岸切口 3 处、走线出口 6 处；削剩残迹留 1 段（其余丢掉——残迹长度只是窗口参数的函数、不是人的设计）；铺铜带走 0 张（本板两张都是平面网，按「块内不带铺铜」整张删，拼板时重铺）。
    - 块里 1 个平面网焊盘一根铜都没有（源板就靠铺铜连它），拼板时由整板铺铜接上——DRC 的未连通条数就是它们。
    - '**+3.3V 裂成 2 个铜岛**（各含焊盘）：源板上 +3.3V 是经块外干线绕过去连的，窗口把它切断了——这是口岸网，装板时由块外干线接上；GND 裂成 3 个铜岛（没铺铜的必然结果：每颗件的接地脚各自一小块铜），拼板时由整板铺铜接上。'
    - kicad-cli DRC：isolated_copper 0；未连通 3 条（+3.3V×2、GND×4）；断头走线 3 + 悬空过孔 4 处就是"口岸切口"（铜走到窗口边就停 = 块的铜接口，留着）；源板基线：未连通
      0 / isolated_copper 0 / 违规 248 条。
