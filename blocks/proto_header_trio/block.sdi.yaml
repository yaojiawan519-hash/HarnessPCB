project:
  kind: block
  name: proto_header_trio
  version: sdi/1
defs:
  proto_header_trio:
    category: connector
    rationale: '**主机排针的三联座**：J2 是 1×10 卧式母座（骑在 Bus Pirate 5 的十脚排针上）、 J3 与 J5 是同序的竖针（给面包板/杜邦线用），三只**逐脚并联**——同一根
      IO 在三处都能碰到。 十脚顺序照主机约定：`1=VOUT / 2..9=IO0..IO7 / 10=GND`（page 上的全局标签就是这个名字）。 ⚠ 这块板**没有自己的电路**：它只是把一根总线复制到三个接插件上，所以
      「内部网」一个都没有，十张网全是接口网（`--iface` 声明：IO0..IO7 + GND，加上板上 另有两只洞洞板焊盘挂了 VOUT，VOUT 天然是口岸网）。 复用要点：① 三只排针的脚位要一一对齐，插错一根就整条总线错位；
      ② 源板上那 1654 个洞洞板焊盘**不在块里**（块只收有电路的那三只）； ③ 地在这块板上只靠铺铜连，块里按规矩不带铺铜，拼板时整板重铺接上。'
    ports:
    - name: IO0
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/2
      exit:
        pin: J2-2
        connector: true
      note: 第 2 脚 = `IO0`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 2
        位是同一张网
    - name: IO1
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/3
      exit:
        pin: J2-3
        connector: true
      note: 第 3 脚 = `IO1`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 3
        位是同一张网
    - name: IO2
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/4
      exit:
        pin: J2-4
        connector: true
      note: 第 4 脚 = `IO2`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 4
        位是同一张网
    - name: IO3
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/5
      exit:
        pin: J2-5
        connector: true
      note: 第 5 脚 = `IO3`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 5
        位是同一张网
    - name: IO4
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/6
      exit:
        pin: J2-6
        connector: true
      note: 第 6 脚 = `IO4`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 6
        位是同一张网
    - name: IO5
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/7
      exit:
        pin: J2-7
        connector: true
      note: 第 7 脚 = `IO5`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 7
        位是同一张网
    - name: IO6
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/8
      exit:
        pin: J2-8
        connector: true
      note: 第 8 脚 = `IO6`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 8
        位是同一张网
    - name: IO7
      kind: signal
      class: digital
      direction: bidirectional
      pin: J2/9
      exit:
        pin: J2-9
        connector: true
      note: 第 9 脚 = `IO7`：J2/J3/J5 三只 1×10 **逐脚并联**，同一根 IO 在三处都能碰到；出口脚登记在 **J2**（骑在主机排针上的卧座），J3/J5 第 9
        位是同一张网
    rails:
    - GND
    - VOUT
    parts:
    - ref: J2
      lib: Connector_Generic:Conn_01x10
      value: Conn_01x10
      footprint: Connector_PinSocket_2.54mm:PinSocket_1x10_P2.54mm_Horizontal
    - ref: J3
      lib: Connector_Generic:Conn_01x10
      value: Conn_01x10
      footprint: pinheader-reduced:PinHeader_1x10_P2.54mm_Vertical_No_Silk
    - ref: J5
      lib: Connector_Generic:Conn_01x10
      value: Conn_01x10
      footprint: pinheader-reduced:PinHeader_1x10_P2.54mm_Vertical_Reduced_2
    conns:
