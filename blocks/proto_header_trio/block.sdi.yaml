    - ref: J5
      pin: '3'
      net: IO1
    - ref: J2
      pin: '4'
      net: IO2
    - ref: J3
      pin: '4'
      net: IO2
    - ref: J5
      pin: '4'
      net: IO2
    - ref: J2
      pin: '5'
      net: IO3
    - ref: J3
      pin: '5'
      net: IO3
    - ref: J5
      pin: '5'
      net: IO3
    - ref: J2
      pin: '6'
      net: IO4
    - ref: J3
      pin: '6'
      net: IO4
    - ref: J5
      pin: '6'
      net: IO4
    - ref: J2
      pin: '7'
      net: IO5
    - ref: J3
      pin: '7'
      net: IO5
    - ref: J5
      pin: '7'
      net: IO5
    - ref: J2
      pin: '8'
      net: IO6
    - ref: J3
      pin: '8'
      net: IO6
    - ref: J5
      pin: '8'
      net: IO6
    - ref: J2
      pin: '9'
      net: IO7
    - ref: J3
      pin: '9'
      net: IO7
    - ref: J5
      pin: '9'
      net: IO7
    - ref: J2
