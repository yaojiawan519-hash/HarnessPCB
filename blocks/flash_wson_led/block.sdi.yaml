project:
  kind: block
  name: flash_wson_led
  version: sdi/1
defs:
  flash_wson_led:
    category: indicator
    rationale: '**一颗电源指示灯**：`VOUT → R1（2K）→ D1 阳极 → D1 阴极 → GND`。 两颗 0805 **横排**（R1 在左 x=149.50、D1 在右
      x=154.00，中心距 4.50mm， R1 rot 0 / D1 rot 180——阳极对着电阻）。 按 VOUT=3.3V、这颗 LED 的 Vf≈2.0V 算，电流约 **(3.3−2.0)/2000
      = 0.65mA**——很暗。 ⚠ D1 的**阳极是 pad 2**（网 `Net-(D1-A)`）、**阴极是 pad 1**（接 GND）： 0805 LED 封装里 1 是阴极，别按"1
      是阳极"的习惯接。 ⚠ 本块**只指示 VOUT 有没有电**，不指示芯片侧 `VCC_CHIP` 通不通（中间还有 SW1）。'
    ports:
    - name: VOUT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R1-1
        connector: false
      pin: R1/1
      note: 灯的取电端：VOUT → R1 2K → D1 阳极(pad 2)
    rails:
    - GND
    parts:
    - ref: D1
      lib: Device:LED
      value: LED
      footprint: LED_SMD:LED_0805_2012Metric
    - ref: R1
      lib: Device:R
      value: 2K
      footprint: Resistor_SMD:R_0805_2012Metric
    conns:
    - ref: D1
      pin: '1'
      net: GND
    - ref: R1
      pin: '1'
      net: VOUT
    - ref: D1
      pin: '2'
      net: _flash_wson_led_N1
    - ref: R1
      pin: '2'
      net: _flash_wson_led_N1
    placement_prior:
      anchor: R1
      max_mm: 8.0
      rationale: 顶上一横、离板上沿约 0.5mm（封装框 y 68.48 起，板边 67.95）。 复用时就近放 VOUT 的取电点即可，别塞到插头手指够不着的地方。
    slots: []
    hot_loop: []
    internal_nets:
    - _flash_wson_led_N1
    provenance:
      source: human:open-source
      board: Bus Pirate 5 flash adapter (WSON) REV3
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 2 件 / 3 网 / 端口 1 + 轨 1；铜 1 段 + 0 孔；死铜删 0；口岸切口 2；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 flash-wson-rev3.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板那张双面 **GND_CHIP** 灌铜（芯片侧地，不是板上 GND）是整板口岸网，按「块内不带铺铜」整张删，拼板时由整板铺铜接上）'
    notes:
    - '**一颗电源指示灯**：`VOUT → R1（2K）→ D1 阳极(pad 2) → 阴极(pad 1) → GND`，两颗 0805 **横排**（R1 在左 x=149.50、D1 在右
      x=154.00，中心距 4.50mm，R1 rot 0 / D1 rot 180）。2 件 / 3 网：1 个出块端口（VOUT）+ 1 条轨（GND）+ 1 张块内网（`Net-(D1-A)`，卡里
      `_flash_wson_led_N*`，拼装时逐实例改名）。'
    - 按 VOUT=3.3V、Vf≈2.0V 算 ≈ **(3.3−2.0)/2000 = 0.65mA**——很暗；VOUT 若拨到 5V 约 1.5mA。
    - ⚠ D1 的**阳极是 pad 2**、**阴极是 pad 1**（接 GND）：0805 LED 封装里 1 是阴极。
    - ⚠ 本块**只指示 VOUT 有没有电**，不指示芯片侧 `VCC_CHIP` 通不通。
    - 几何：顶上一横，离板上沿 0.53mm（封装框 y 66.11..70.52，板边 67.95）。与 `flash_lotes_led` 的电路完全相同、位置差 0.25mm（两块板子的 LED
      各自挪过）。
    - '⚠ 这一族四张板子的**灌铜是 `GND_CHIP`（芯片侧地），不是 `GND`**。所以「块内不带铺铜」删掉的是芯片地，裂岛/裸脚全落在 `GND_CHIP` 上；`GND`（排针第 10
      脚、灯的回流）本来就没有铺铜，只靠走线。卡里 `GND_CHIP` 记在 **ports** 下、`kind: signal`——那是引擎的规则（rails 只收电源符号 `#PWR`，本板作者用的是全局标签）；它电学上是**芯片的电源/地网**，拼板时按同名接，别当信号口去串阻容。'
    - 铜 1 段 + 0 孔（F 4）；死铜删 0 段/孔（两端全悬空、谁也连不上的才算）；口岸切口 2 处（一端悬空=块的铜接口，按用户拍板留着）、走线出口 2 处；削剩残迹留 1 段（残迹长度只是窗口参数的函数、不是人的设计）；铺铜带走
      0 张（源板那张双面 GND_CHIP 灌铜是整板口岸网，按「块内不带铺铜」整张删，拼板时重铺）。
    - 块里每个脚都有铜可接（没有"只靠铺铜连"的焊盘）。
    - kicad-cli DRC：isolated_copper 0；未连通 **0** 条；断头走线 2 + 悬空过孔 0 处就是"口岸切口"（铜走到窗口边就停 = 块的铜接口，留着）；lib_footprint_*
      2 条（源板自带，见基线）；源板 flash-wson-rev3.kicad_pcb 基线：未连通 0 / isolated_copper 0 / 违规 70 条。
