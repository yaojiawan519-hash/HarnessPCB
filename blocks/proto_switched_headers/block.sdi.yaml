project:
  kind: block
  name: proto_switched_headers
  version: sdi/1
defs:
  proto_switched_headers:
    category: connector
    rationale: "**两只带开关的排针**，各自独立、互不相连： ① `J4`（1×04，`1=VOUT 4=GND`）的 2、3 脚经 `SW2`（`Switch:SW_SPST`）**串联**——\n\
      \  合上就把 2、3 短接，是一只\"跳线开关\"；\n② `J6`（1×05，`1=VOUT 5=GND`）的 2/3/4 脚挂 `SW1`（`Switch:SW_SPDT`）的三只触点，\n\
      \   **3 号脚是公共端**：拨到一头接 2、另一头接 4，正好是一只二选一的排针开关。\n复用要点：这两只是**纯机械件**，没有去抖、没有上拉——接到数字输入上要自己加； J6 的公共端是\
      \ 3 号脚（`Net-(J6-Pin_3)`），换 SPDT 时别把公共端认成 2 号。"
    ports: []
    rails:
    - GND
    - VOUT
    parts:
    - ref: SW2
      lib: Switch:SW_SPST
      value: TS3425BA 098 2.5H 250gf
      footprint: Button_Switch_SMD:SW_SPST_PTS810
    - ref: J6
      lib: Connector:Conn_01x05_Pin
      value: Conn_01x05_Pin
      footprint: Connector_PinHeader_2.54mm:PinHeader_1x05_P2.54mm_Vertical
    - ref: J4
      lib: Connector:Conn_01x04_Pin
      value: Conn_01x04_Pin
      footprint: Connector_PinHeader_2.54mm:PinHeader_1x04_P2.54mm_Vertical
    - ref: SW1
      lib: Switch:SW_SPDT
      value: SW_SPDT
      footprint: Button_Switch_SMD:SW_SPDT_PCM12
    conns:
    - ref: J4
      pin: '4'
      net: GND
    - ref: J6
      pin: '5'
      net: GND
    - ref: J4
      pin: '1'
      net: VOUT
    - ref: J6
      pin: '1'
      net: VOUT
    - ref: J4
      pin: '2'
      net: _proto_switched_headers_N1
    - ref: SW2
      pin: '1'
      net: _proto_switched_headers_N1
    - ref: J4
      pin: '3'
      net: _proto_switched_headers_N2
    - ref: SW2
      pin: '2'
      net: _proto_switched_headers_N2
    - ref: J6
      pin: '2'
      net: _proto_switched_headers_N3
    - ref: SW1
      pin: '3'
      net: _proto_switched_headers_N3
    - ref: J6
      pin: '3'
      net: _proto_switched_headers_N4
    - ref: SW1
      pin: '2'
      net: _proto_switched_headers_N4
    - ref: J6
      pin: '4'
      net: _proto_switched_headers_N5
    - ref: SW1
      pin: '1'
      net: _proto_switched_headers_N5
    placement_prior: {}
    slots: []
    hot_loop: []
    internal_nets:
    - _proto_switched_headers_N1
    - _proto_switched_headers_N2
    - _proto_switched_headers_N3
    - _proto_switched_headers_N4
    - _proto_switched_headers_N5
    provenance:
      basis: 4 件 / 7 网 / 端口 0 + 轨 2；无 carve counts（老 V3.x 血统，板由 V3.3 引擎生成）
      source: human:open-source
      board: KiCAD_Access/hw_sources/BusPirate5-hardware/adapter-blank-plank-1REV0B/blank-plank-rev0b.kicad_sch
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
    geometry_status: schematic-only —— 只交了原理图：源板 `blank-plank-rev0b.kicad_pcb` 上**没有这几只的封装**（板上 1657 个封装里只有
      J2/J3/J5 三只排针带位号，其余是洞洞板焊盘），作者没给它们做 PCB。板级几何（摆放/布线/DRC）未做
    notes:
    - '**两只带开关的排针，各自独立、互不相连**。4 件 / 7 网 / 端口 0 + 轨 2（GND、VOUT）。'
    - ① **J4（`Conn_01x04_Pin`，`1=VOUT 4=GND`）的 2、3 脚经 SW2（`Switch:SW_SPST`）串联**——合上就把 2、3 短接，是一只"跳线开关"，把
      VOUT 或 GND 引到 2/3 脚上去用。
    - ② **J6（`Conn_01x05_Pin`，`1=VOUT 5=GND`）的 2/3/4 脚挂 SW1（`Switch:SW_SPDT`）的三只触点**，**3 号脚是公共端**（SW1
      的脚 2 = B = 动触点，接在 `Net-(J6-Pin_3)` 上）：拨到一头接 2、另一头接 4，是一只二选一的排针开关。
    - ⚠ 这两只是**纯机械件**：没有去抖、没有上拉。接到数字输入上要自己加 RC 或软件消抖；换 SPDT 时别把公共端认成 2 号脚。
    - 五张无名内部网（`_proto_switched_headers_N1..N5`）就是这两只开关的触点网：`Net-(J4-Pin_2)`、`Net-(J4-Pin_3)`、`Net-(J6-Pin_2)`、`Net-(J6-Pin_3)`、`Net-(J6-Pin_4)`。拼装时按实例改名。
    - ⚠ **只有原理图**：源板 `blank-plank-rev0b.kicad_pcb` 上没有 J4/J6/SW1/SW2 的封装（板上 1657 个封装里只有 J2/J3/J5 三只排针带位号），作者没给这块做
      PCB。
