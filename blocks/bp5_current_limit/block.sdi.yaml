    - ref: R606
      pin: '2'
      net: CURRENT_SENSE
    - ref: C416
      pin: '1'
      net: GND
    - ref: C603
      pin: '1'
      net: GND
    - ref: C605
      pin: '2'
      net: GND
    - ref: U602
      pin: '2'
      net: GND
    - ref: C603
      pin: '2'
      net: _bp5_current_limit_N1
    - ref: D601
      pin: '2'
      net: _bp5_current_limit_N1
    - ref: Q601
      pin: '3'
      net: _bp5_current_limit_N1
    - ref: R606
      pin: '1'
      net: _bp5_current_limit_N1
    - ref: U602
      pin: '3'
      net: _bp5_current_limit_N1
    - ref: Q601
