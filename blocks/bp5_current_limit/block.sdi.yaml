project:
  kind: block
  name: bp5_current_limit
  version: sdi/1
defs:
  bp5_current_limit:
    category: analog
    rationale: '**限流比较器 + 硬件锁存（作者标题 Current limit）**：U602 = `LMV331` 比较器， 反相端阈值由 `CURRENT_ADJ_MCU` 经 R415
      10K / C416 0.1µF 滤波给（τ≈1ms）， 同相端接 `CURRENT_SENSE`；Q601 = 通用双 PNP 做成**锁存**（节点 A 经 R610 10K 看 `CURRENT_DETECT`，拉得越低越锁死），D601
      把比较器反相端钳在 `+3V3` 一个压降内， R611 10K 引 `CURRENT_RESET` 复位。12 件 / 11 网。 ⚠ **这是一旦触发就自己锁住、只能靠 `CURRENT_RESET`
      或断电解除**的硬件保护， 不是 MCU 轮询那种软限流；拼板若拿掉 Q601，`CURRENT_DETECT` 会变成一次性的比较器输出。 ⚠ 作者把 R415/C416 摆在 MCU 那头（x≈136-141），离
      U602 二十毫米，**块框因此横跨整页**—— 照抄不改，因为那是 PWM 阈值滤波该靠近谁的问题（作者选了靠近源）。 ⚠ 作者注释：Q601 是通用双 PNP（EBCEBC 脚序），可换
      Q401 那种匹配对，但贵。'
    ports:
    - name: CURRENT_ADJ_MCU
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R415-2
        connector: false
      pin: R415/2
      note: MCU 的 PWM 阈值（`micro-rp2040` 页），块内 R415/C416 滤成直流
    - name: CURRENT_DETECT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R610-2
        connector: false
      pin: R610/2
      note: 锁存后的过流标志，去 `bp5_current_en_gate` 与 MCU
    - name: CURRENT_RESET
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R611-1
        connector: false
      pin: R611/1
      note: MCU 给脉冲解除锁存
    - name: CURRENT_SENSE
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R606-2
        connector: false
      pin: R606/2
      note: 来自 `bp5_current_sense` 的放大器输出
    rails:
    - +3V3
    - GND
    parts:
    - ref: R606
      lib: Device:R_Small
      value: 10K
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: C603
      lib: Device:C_Small
      value: DNF
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: C605
      lib: Device:C_Small
      value: 0.1uF
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: D601
      lib: Diode:1N4148WS
      value: 1N4148WT
      footprint: Diode_SMD:D_SOD-523
    - ref: R608
      lib: Device:R_Small
      value: 200R
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: R609
      lib: Device:R_Small
      value: 10K
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: R610
      lib: Device:R_Small
      value: 10K
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: R611
      lib: Device:R_Small
      value: 10K
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: Q601
      lib: kicad5-device:Q_DUAL_PNP_PNP_E1B1C2E2B2C1
      value: MMDT3906
      footprint: Package_TO_SOT_SMD:SOT-363_SC-70-6
    - ref: R415
      lib: Device:R_Small
      value: 10K
      footprint: Resistor_SMD:R_0402_1005Metric
    - ref: C416
      lib: Device:C_Small
      value: 0.1uF
      footprint: Capacitor_SMD:C_0402_1005Metric
    - ref: U602
      lib: Comparator:LMV331
      value: LMV331
      footprint: Package_TO_SOT_SMD:SOT-23-5
    conns:
    - ref: C605
      pin: '1'
      net: +3V3
    - ref: D601
      pin: '1'
      net: +3V3
    - ref: Q601
      pin: '1'
      net: +3V3
    - ref: Q601
      pin: '4'
      net: +3V3
    - ref: R609
      pin: '1'
      net: +3V3
    - ref: U602
