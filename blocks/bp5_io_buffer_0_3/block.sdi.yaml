      rationale: U301-304 在板上排成一行（y≈103.1，x 106.10/109.25/112.30/115.30，节距约 3.07mm， 全部 rot −90°）。每只 U
        的正上方 2.7mm 各一只 `+3V3` 去耦、正下方 2.6mm 各一只 `VREF_VOUT` 去耦（两排 y≈100.3 / y≈105.7，与 U 一一对齐）——**一只 U 上下各一只电容**
        就是这块板的布局事实。四只网络在 U 行的上下方成堆：RN301/RN302 在 x≈112.6 的 y 95.5/98.4（行上方）、RN303 在 109.40,98.30、RN304/RN305
        在 y 108.05（行下方）。 即"**电容贴脚、电阻网络成堆放在两端**"，不是串阻贴着各自引脚走。
