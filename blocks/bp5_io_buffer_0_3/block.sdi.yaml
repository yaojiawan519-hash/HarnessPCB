project:
  kind: block
  name: bp5_io_buffer_0_3
  version: sdi/1
defs:
  bp5_io_buffer_0_3:
    category: interface
    rationale: "**BPIO0..3 四路双向电平转换**：U301-304 = `AiP74LVC1T45`（SN74LVC1T45 的国产物， SOT-363-6），逐脚 `1=VCCA\
      \ 2=GND 3=A 4=B 5=DIR 6=VCCB`；本块里 **`1 (VCCA) = +3V3`、`6 (VCCB) = VREF_VOUT`**，也就是 A 侧是 MCU 的 3.3V\
      \ 侧、 B 侧是目标电压侧（`VREF_VOUT` 由 `bpu-current_limiter` 那页给，随 BPIO 的 I/O 电压走）。 每路两只 330R 串阻 + 两只 1M 下拉\
      \ + 一只 100K 方向下拉，全用 `R_Array_Convex_4x0402` （一只网络管四路，所以四路必须同块）： · `BUFIO<n> ── RN301 330R ── (无名网)\
      \ ── U30x.3 (A)`，该网另有 `RN302 1M ── GND`； · `BPIO<n>  ── RN305 330R ── (无名网) ── U30x.4 (B)`，该网另有\
      \ `RN304 1M ── GND`； · `BUFDIR<n> ── U30x.5 (DIR)`，`RN303 100K ── GND` → **方向默认低 = B→A**\n  （74LVC1T45：DIR\
      \ 高 A→B、低 B→A），即上电默认\"目标侧 → MCU\"，MCU 侧不会被反向推动。\n17 件 / 23 网 / 端口 12（`BPIO0..3` `BUFIO0..3` `BUFDIR0..3`，外加参考/供电网\
      \ `VREF_VOUT`） + 轨 `+3V3`/`GND` + 内部网 8（四组 330R 与 1M 的交点）。 作者原话（卡片 `decoration`，就在这组旁边）：「Small pull-down\
      \ on VOUT_VREF. Ensures proper partial power down function of the 74LVC1T45」——那两只 1M 是为了 `VREF_VOUT`\
      \ 半供电时 A/B 脚不悬空（74LVC1T45 的 partial power-down 特性靠它成立）。"
