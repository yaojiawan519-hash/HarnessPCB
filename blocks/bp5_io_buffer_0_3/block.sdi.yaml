      source: human:open-source
      board: Bus Pirate 5 主板 REV10A（`bus_pirate_pcb/5-REV10A`）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
    geometry_status: schematic-only —— 板级几何待扣（成员已定，PCB 从整板 `REV10a.kicad_pcb` 扣）
    notes:
    - '**BPIO0..3 四路双向电平转换**：U301-304 = `AiP74LVC1T45`（SN74LVC1T45 的国产物，SOT-363-6），逐脚 `1=VCCA 2=GND 3=A
      4=B 5=DIR 6=VCCB`。本块 **`1 VCCA = +3V3`、`6 VCCB = VREF_VOUT`**——A 侧是 MCU 的 3.3V 侧，B 侧是目标电压侧。17 件
      / 23 网 / 端口 13 + 轨 `+3V3`/`GND` / 内部网 8 条。'
    - '**每路四只电阻、两个串阻网络**（都是 `R_Array_Convex_4x0402` 四联，一只网络管四路，所以四路必须同块）：`BUFIO<n> ── RN301 330R ── _N<n>
      ── U30x.3 (A)`，同一只内部网另有 `RN302 1M ── GND`；`BPIO<n> ── RN305 330R ── _N<n+4> ── U30x.4 (B)`，另有 `RN304
      1M ── GND`；`BUFDIR<n> ── U30x.5 (DIR)`，`RN303 100K ── GND`。于是**方向默认是低 = B→A**（74LVC1T45：DIR 高 A→B、低
      B→A），上电就先把目标侧读进 MCU 侧。'
    - '**端口 13 条里 8 条在本页只有一条腿**：`BUFIO0..3`（只落在 RN301 上）和 `BUFDIR0..3`（RN303 + U30x.5 两只脚，但另一端在 MCU）。它们靠全局标签去
      `micro-rp2040` 页，判据是 `sdi/block_sch.py` 的 `external_globals()`（别页有同名全局标签）。`VREF_VOUT` 也是端口不是轨：它是全局标签画的，由
      `bpu-current_limiter` 页给。'
    - 作者原话（卡片 `decoration`，就压在这组旁边）：「Small pull-down on VOUT_VREF. Ensures proper partial power down function
      of the 74LVC1T45」——那两只 1M 不是为了分压，是为了 `VREF_VOUT` 半供电时 A/B 脚不悬空；74LVC1T45 的 partial power-down 特性就靠这个成立。删掉它们，目标侧掉电时
      MCU 侧会被反灌。
    - '**布局事实**：U301-304 一行（y≈103.1，节距 3.07mm，全 rot −90°）；每只 U **正上方 2.7mm 一只 `+3V3` 去耦、正下方 2.6mm 一只 `VREF_VOUT`
      去耦**（两排 y≈100.3 / 105.7，与 U 一一对齐）；四只电阻网络成堆放在行的上下两端（RN301/RN302 在 x≈112.6 上方，RN303 在 109.4 上方，RN304/RN305
      在 y≈108 下方），**不是串阻贴着各自引脚走**——复用这块时照这个摆法才和原板一致。'
    - '**铜**：262 段 + 44 孔、0 张铺铜；孤立铜删 20 段/孔；口岸切口 23 处（留着，装板时从焊盘重新引）；残迹留 0。`naked_plane_pads` 24（**全是 GND**，源板靠整板铺铜连），`island_split`
      `GND×24`——这只块单看 GND 是碎的，拼板整板重铺后并起来。'
    - ⚠ **`counts.borrowed_pads` 8 处**：`BPIO0..3 → RN318/RN312`（右半那两块缓冲器的串阻网络，同一根 BPIO 干线从 J301/J302 一直铺到
      330R 上）、`VREF_VOUT → Q307.2 / R301.1`（`bpu-current_limiter` 页的回流保护管与限流电阻）。这些铜端压在**别的块的焊盘**上换层，块单看这里是断的；拼板时那几只件插上就通。
