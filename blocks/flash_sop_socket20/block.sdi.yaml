project:
  kind: block
  name: flash_sop_socket20
  version: sdi/1
defs:
  flash_sop_socket20:
    category: connector
    rationale: '**下排那只 20 触点测试座**（作者自建封装 `TEST_SOCKETS:20PIN_SCOKET`）+ C1 0.1uF 芯片侧去耦（`VCC_CHIP`/`GND_CHIP`）。
      20 个触点里 **4 个空着**（5、6、15、16 各一个焊盘、哪根网都不接）——它们在网表里 是四张单脚网，卡里按无名内部网登记，拼装时逐实例改名，别当端口。 信号分布：**CS 在 1+7、CDI
      在 2+8、GND_CHIP 在 4+10、CDO 在 11+17、SCLK 在 12+18、 VCC_CHIP 在 14+20、HOLD 独占 3+9+13+19**——同样是"同一列几个位置同网"，
      **哪个触点夹到芯片第几脚按手册对照本卡网表核**。`WP` 不在座上。 ⚠ 页上作者在这只座上下各画了一只虚线框（本卡整窗带走）：他标的**两个插片位置**。'
    ports:
    - name: CDI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J5-2
        connector: true
      pin: J5/2
      note: 触点 2+8 → 芯片 MISO
    - name: CDO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J5-11
        connector: true
      pin: J5/11
      note: 触点 11+17 → 芯片 MOSI
    - name: CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J5-1
        connector: true
      pin: J5/1
      note: 触点 1+7
    - name: GND_CHIP
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: C1-2
        connector: true
      pin: C1/2
      note: 触点 4+10（+ C1 的 2 脚）：芯片侧地，源板上靠整板灌铜连成一片
    - name: HOLD
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J5-13
        connector: true
      pin: J5/13
      note: 触点 3+9+13+19（四只触点同网）
    - name: SCLK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J5-12
        connector: true
      pin: J5/12
      note: 触点 12+18
    - name: VCC_CHIP
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: C1-1
        connector: true
      pin: C1/1
      note: 触点 14+20（+ C1 的 1 脚）：芯片侧电源
    rails: []
    parts:
    - ref: J5
      lib: Connector_Generic:Conn_02x10_Counter_Clockwise
      value: 20PIN
      footprint: TEST_SOCKETS:20PIN_SCOKET
    - ref: C1
      lib: Device:C_Small
      value: 0.1uF
      footprint: Capacitor_SMD:C_0805_2012Metric
    conns:
    - ref: J5
      pin: '2'
      net: CDI
    - ref: J5
      pin: '8'
      net: CDI
    - ref: J5
      pin: '11'
      net: CDO
    - ref: J5
      pin: '17'
      net: CDO
    - ref: J5
      pin: '1'
      net: CS
    - ref: J5
      pin: '7'
      net: CS
    - ref: C1
      pin: '2'
      net: GND_CHIP
    - ref: J5
      pin: '10'
      net: GND_CHIP
    - ref: J5
      pin: '4'
      net: GND_CHIP
    - ref: J5
      pin: '13'
      net: HOLD
    - ref: J5
      pin: '19'
      net: HOLD
    - ref: J5
      pin: '3'
      net: HOLD
    - ref: J5
      pin: '9'
      net: HOLD
    - ref: J5
      pin: '12'
      net: SCLK
    - ref: J5
      pin: '18'
      net: SCLK
    - ref: C1
      pin: '1'
      net: VCC_CHIP
    - ref: J5
      pin: '14'
      net: VCC_CHIP
    - ref: J5
      pin: '20'
      net: VCC_CHIP
    placement_prior:
      anchor: J5
      max_mm: 10.0
      rationale: 座下排（封装框 25.01×22.56mm），C1 贴座右上沿。复用要点：① 座要留插片空间； ② C1 必须贴着 `VCC_CHIP` 进座的那两个触点；③ 与 `flash_sop_socket16`
        上下紧叠 （间隙 0.36mm），两只一起用时照这个间距。
    slots: []
    hot_loop: []
    provenance:
      source: human:open-source
      board: Bus Pirate 5 flash adapter (SOP) REV3
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 2 件 / 11 网 / 端口 7 + 轨 0；铜 38 段 + 2 孔；死铜删 20；口岸切口 9；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 flash-sop-rev3.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板那张双面 **GND_CHIP** 灌铜（芯片侧地，不是板上 GND）是整板口岸网，按「块内不带铺铜」整张删，拼板时由整板铺铜接上）'
    notes:
    - '**下沿那只 20 脚测试座**：J5 是作者自建封装 `TEST_SOCKETS:20PIN_SCOKET`（20 触点 + 2 个不带号的定位焊盘），C1 0.1uF 是它的芯片侧去耦。2
      件 / 7 网 / 7 个端口、**没有轨也没有块内网**——这一块只有芯片侧的那两个电源网，板上那个 `GND` 和电源灯都不在这里。'
    - '**20 只触点里 16 只接了信号，另有 4 只（5/6/15/16）是空脚**：`CS` 在 1+7、`CDI` 在 2+8、`HOLD` 在 3+9+13+19、`GND_CHIP`
      在 4+10、`CDO` 在 11+17、`SCLK` 在 12+18、`VCC_CHIP` 在 14+20。那 4 只空脚在 KiCad 里各是一张单脚无名单，**不写进卡**（`sdi.block_sch`
      打印"空脚 4 只"），拼装时也不要给它们编网名。'
    - ⚠ 20 脚座的触点分布**与 16 脚座不同**（同一根网的两个触点跨了 6 个脚位而不是 4 个）——两只座不能按同一个脚表互换。
    - '`WP` 在这块上没有触点，同板上也只有排针第 5 脚有它（见 `flash_sop_port` 的说明）：这一版要控写保护得自己飞线。'
    - 几何：J5 @(161.75, 96.50) rot 0；C1 @(175.25, 86.75) rot 90 贴板右沿（在座的右上角，离 `VCC_CHIP` 的 14/20 两个触点最近）。复用要点：座要留出压片的手指空间。
    - '⚠ 这一族四张板子的**灌铜是 `GND_CHIP`（芯片侧地），不是 `GND`**。所以「块内不带铺铜」删掉的是芯片地，裂岛/裸脚全落在 `GND_CHIP` 上；`GND`（排针第 10
      脚、灯的回流）本来就没有铺铜，只靠走线。卡里 `GND_CHIP` 记在 **ports** 下、`kind: signal`——那是引擎的规则（rails 只收电源符号 `#PWR`，本板作者用的是全局标签）；它电学上是**芯片的电源/地网**，拼板时按同名接，别当信号口去串阻容。'
    - 铜 38 段 + 2 孔（B 12 / F 47）；死铜删 20 段/孔（两端全悬空、谁也连不上的才算）；口岸切口 9 处（一端悬空=块的铜接口，按用户拍板留着）、走线出口 12 处；削剩残迹留
      1 段（残迹长度只是窗口参数的函数、不是人的设计）；铺铜带走 0 张（源板那张双面 GND_CHIP 灌铜是整板口岸网，按「块内不带铺铜」整张删，拼板时重铺）。
    - 块里 3 个 **GND_CHIP** 焊盘在窗口内一根铜都没挨到：源板上它们全靠那张双面灌铜接起来，块按「不带铺铜」删了，拼板时由整板铺铜接上——DRC 未连通那几条就是它们。
    - '**GND_CHIP 裂成 3 个铜岛**：源板上这块芯片地靠那张双面灌铜连成一片，块内不带铺铜就各自成岛——拼板时由整板 GND_CHIP 铺铜接上，不是断线。'
    - kicad-cli DRC：isolated_copper 0；未连通 2 条，**全是 GND_CHIP**——芯片侧地源板上靠整板灌铜，块按规矩不带铺铜，拼板时铺上就通；断头走线 9 +
      悬空过孔 1 处就是"口岸切口"（铜走到窗口边就停 = 块的铜接口，留着）；lib_footprint_* 2 条（源板自带，见基线）；源板 flash-sop-rev3.kicad_pcb
      基线：未连通 0 / isolated_copper 0 / 违规 64 条。
