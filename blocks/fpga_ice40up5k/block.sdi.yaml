project:
  kind: block
  name: fpga_ice40up5k
  version: sdi/1
defs:
  fpga_ice40up5k:
    category: mcu
    rationale: iCE40UP5K-SG48（QFN-48 带 5.6×5.6 散热盘）的**裸片最小系统**：三组银行 IO 电压选择 （SJ31/SJ19 选银行 0，SJ20/SJ26
      选银行 1/2，都做成可焊跳线而不是 0Ω 电阻）、 内核电源（3V3 经 D2 1N4148 降到 2.5V，再经 SJ34 与板上 1.2V 二者选一）、 PLL 滤波（R6 100Ω +
      C10/C11）、CRESET 上拉 R5 10K，以及 8 颗去耦 （C5/C6/C14/C15/C22/C35 0.1u 贴脚，C11/C30 4.7u 作大容量）。 出块 42 个信号全是
      FPGA 的 IO（`IOT_*`/`IOB_*` 命名照原图）加 3 个控制脚 （CDONE、CRESET_N）与 3 个 LED 驱动（LED_R/G/B，走 bank 2 的 IO），
      轨 +1V2/+3V3/GND。**块内自造三条电源**：+1.2V_CORE（内核）、+2V5（D2 之后）、 VCC_PLL——它们在这里生成、不出块，所以是内部网，不是轨。 复用要点：三组跳线的默认焊法决定
      IO 电平，换板时必须先定 3.3V 还是 1.2V 再落铜。
    ports:
    - name: CDONE
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U2-7
        connector: false
      pin: U2/7
      note: 配置完成（开漏）。另一端在 usb_ftdi_bridge 的 U3.19，led_indicator 的 D1 也挂在这根上
    - name: CRESET_N
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R5-1
        connector: false
      pin: R5/1
      note: 配置复位（低有效）。R5 10K 上拉在本块内，另一端到 U3.20 与 J2
    - name: FPGA_SI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U2-17
        connector: false
      pin: U2/17
      note: 配置口串行入（SPI 的 MOSI 侧）
    - name: FPGA_SO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U2-14
        connector: false
      pin: U2/14
      note: 配置口串行出（SPI 的 MISO 侧）
    - name: FT_SCK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U2-15
        connector: false
      pin: U2/15
      note: 配置口时钟，源头是 FT232H 的 U3.13
    - name: FT_SSn
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U2-16
        connector: false
      pin: U2/16
      note: 配置口片选，源头是 FT232H 的 U3.17
    - name: IOB_0A
