    placement_prior:
      anchor: U2
      max_mm: 22.0
      rationale: 8 颗去耦全在芯片 5mm 内（C14 2.61 / C11 2.65 / C15 2.76 / C30 2.80 / C5 3.02 / C10 3.10 / C6 3.51
        / C22 3.98 mm，到芯片中心），R5 3.77、PLL 的 R6 5.61、 内核二极管 D2 6.82、SJ34 7.16 mm。三组电压选择跳线故意放在块外缘 （SJ31/SJ20
        10.8mm、SJ19/SJ26 12.58mm）——它们是**装配时才动的**，不能压在芯片嘴边。 复用时这张图的判据是"去耦贴脚 + 跳线在外缘"，不是"照抄 25.16×9.51 的长条比例"。
