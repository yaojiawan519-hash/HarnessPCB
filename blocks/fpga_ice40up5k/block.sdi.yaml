      basis: 20 件 / 50 网 / 端口 42 + 轨 3；内网 3；铜 242 段 + 29 孔；死铜删 65；口岸切口 44；窗口 2.29mm；DRC isolated_copper
        0；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 UPduino_v3.01.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板的铺铜按"块内不带铺铜"整张删掉，拼板时由整板铺铜接上）'
    notes:
    - 20 件 / 50 网：42 个信号口岸 + 轨 +1V2/+3V3/GND；U2 在原理图里是**四个单元**（银行 0/1/2 与电源），卡里因此有 23 条 parts 记录、20 个位号——按位号算件数是
      20。
    - 块内自造三条电源：+1.2V_CORE（内核）、+2V5（D2 之后）、VCC_PLL。它们在这里生成、不出块，所以记成 internal_nets 而不是轨。
    - 铜 242 段 + 29 孔（B.Cu 179 / F.Cu 240 / In2.Cu 26）；死铜删 65 段/孔；口岸切口 44 处。内部网 +1.2V_CORE 的铜伸到件框外 1.64mm，窗口按它加宽到
      1.69；另有 7 个过孔落在窗口外、却连着块内的铜，窗口再加到 **2.29mm**。
    - U2.3/U2.4（IOB_9B / IOB_8A）的铜从芯片出来走 5.84mm，一直扎进 **J3 排针的孔**（J3.19 / J3.18，属 connectors_io 块）——这是这两只脚在块里唯一的一段铜，所以按"焊盘自己出来的铜接口"照留
      2 段残迹，不删。
    - 有 5 处信号借道**块外器件**的孔换层（FT_SCK→R9.1/U5.6、FT_SSn→U5.1、LED_G→D3.3、LED_R→D3.4）：块单看这几处是断的，拼板时插上就通。
    - kicad-cli DRC：isolated_copper 0；未连通 2 条，都是轨（存源板靠铺铜连，块里没铺铜）；其余违规是上游板自带的（源板本身 738 条，U3 散热盘无网 70 条一类）。
    - 源板 4 层（F/In1/In2/B），本块内层走线 In2 26 段；源板 In1 铺的是 GND、In2 铺的是 +3V3，**两层也同时走信号**。拼板整层重铺时铺铜必须绕开这些走线（图样会被切碎，规则不当会同层短路）——这是拼板步的决策，块内一张铺铜都没带。
