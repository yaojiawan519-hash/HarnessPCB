project:
  kind: block
  name: ddr5_bus_headers
  version: sdi/1
defs:
  ddr5_bus_headers:
    category: interface
    rationale: '**这块板的测试接口**：J2 1x10 卧式母座 + J3 1x10 直针，脚位一一对应 （1=BULK_VIN、2=SDA、3=SCL、4=PWR_GOOD_OUT、10=GND）。J2
      朝板边、J3 竖立， 等于"插探针/杜邦线"和"插排线"两种接法。 5~9 五根是**纯贯通网**：页上只有这两只排针连着它们（各对 J2.5↔J3.5 … J2.9↔J3.9）， 没有任何器件挂在上面，所以在卡里登记为块内网——拼装时按实例改名，两份同块插进一块板
      才不会把这几根短在一起。想在拼板里用这几路，得在外面自己接。 复用要点：① 2.54mm 脚序是本板约定（1=电源、10=地、2/3=I²C），换主机时整块替换； ② PWR_GOOD_OUT
      是块外的两级管**开集输出**（R13 6.8K 上拉到 5V）， 探针直接量这里就能看到内存条的就绪状态；③ 卧式母座开口朝板沿，旁边要给插头留插拔空间。'
    ports:
    - name: PWR_GOOD_OUT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J2-4
        connector: true
      pin: J2/4
      note: J2.4 / J3.4：内存条就绪的**开集**输出（高=就绪，由 R13 6.8K 拉到 5V）
    - name: SCL
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J2-3
        connector: true
      pin: J2/3
      note: J2.3 / J3.3：5V 侧 I²C 时钟
    - name: SDA
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J2-2
        connector: true
      pin: J2/2
      note: J2.2 / J3.2：5V 侧 I²C 数据（来自 i2c_level_shift 的 B 侧）
    rails:
    - BULK_VIN
    - GND
    parts:
    - ref: J2
      lib: Connector_Generic:Conn_01x10
      value: Conn_01x10
      footprint: Connector_PinSocket_2.54mm:PinSocket_1x10_P2.54mm_Horizontal
    - ref: J3
      lib: Connector_Generic:Conn_01x10
      value: Conn_01x10
      footprint: Connector_PinHeader_2.54mm:PinHeader_1x10_P2.54mm_Vertical
    conns:
    - ref: J2
      pin: '10'
      net: GND
    - ref: J3
      pin: '10'
      net: GND
    - ref: J2
      pin: '4'
      net: PWR_GOOD_OUT
    - ref: J3
      pin: '4'
      net: PWR_GOOD_OUT
    - ref: J2
      pin: '3'
      net: SCL
    - ref: J3
      pin: '3'
      net: SCL
    - ref: J2
      pin: '2'
      net: SDA
    - ref: J3
      pin: '2'
      net: SDA
    - ref: J2
      pin: '5'
      net: _ddr5_bus_headers_N1
    - ref: J3
      pin: '5'
      net: _ddr5_bus_headers_N1
    - ref: J2
      pin: '6'
      net: _ddr5_bus_headers_N2
    - ref: J3
      pin: '6'
      net: _ddr5_bus_headers_N2
    - ref: J2
      pin: '7'
      net: _ddr5_bus_headers_N3
    - ref: J3
      pin: '7'
      net: _ddr5_bus_headers_N3
    - ref: J2
      pin: '8'
      net: _ddr5_bus_headers_N4
    - ref: J3
      pin: '8'
      net: _ddr5_bus_headers_N4
    - ref: J2
      pin: '9'
      net: _ddr5_bus_headers_N5
    - ref: J3
      pin: '9'
      net: _ddr5_bus_headers_N5
    - ref: J2
      pin: '1'
      net: BULK_VIN
    - ref: J3
      pin: '1'
      net: BULK_VIN
    placement_prior:
      anchor: J2
      max_mm: 5.0
      rationale: 两只排针并列（实测中心距 3.81mm、脚距 2.54mm、焊盘 1.70mm）。规矩是 **母座开口朝板边**，直针立在旁边——摆反了插头伸不进板沿。
    slots: []
    hot_loop: []
    internal_nets:
    - _ddr5_bus_headers_N1
    - _ddr5_bus_headers_N2
    - _ddr5_bus_headers_N3
    - _ddr5_bus_headers_N4
    - _ddr5_bus_headers_N5
    provenance:
      source: human:open-source
      board: Bus Pirate 5 DDR5 内存适配板（adapter-ram-ddr5-1REV2）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 2 件 / 10 网 / 端口 3 + 轨 2；铜 9 段 + 0 孔；死铜删 2；口岸切口 5；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 adapter-ram-ddr5-1REV2.kicad_pcb 原样扣，坐标
      = 源板坐标平移，origin: page；源板两张铺铜（GND 平面 + LDO 输出那一小片 +3.3V）按"块内不带铺铜"整张删掉，拼板时由整板铺铜接上）'
    notes:
    - '**这块板的测试接口**：J2 1x10 卧式母座 + J3 1x10 直针，脚位一一对应（1=BULK_VIN、2=SDA、3=SCL、4=PWR_GOOD_OUT、10=GND）。2 件
      / 10 网：3 个出块端口 + 2 条轨 + **5 张块内网**。'
    - 5~9 五根是**纯贯通网**（各对 J2.5↔J3.5 … J2.9↔J3.9）：本页没有第三个器件挂上去，两只排针之间就是一段直通铜。按"出块网 = 块外还有成员"的判据它们只能是块内网，所以卡里登记为块内网、拼装时逐实例改名（两份同块才不会并网）；拼板时想用这五路，得在外面自己接。
    - 2.54mm 脚序是本板约定（1=电源、10=地、2/3=I²C），换主机时整块替换。
    - J2 是**卧式**母座（开口朝板边）、J3 是直针（朝上）——复制块时朝向一起搬，摆反了母座伸不出板沿，插头也进不来。两只排针实测中心距 3.81mm、焊盘 1.70mm。
    - ⚠ 网名：本板的 5V 供电在**页上有三个名字**（`BULK_VIN` 全局标签 / `+5V` 电源符号 / `VOUT` 全局标签），kicad-cli 把它们当同一张网、名取 `BULK_VIN`；卡里的网名一律用
      `BULK_VIN`，而块内原理图上剩的可能是其中另一个名字——同一个网，不是两根轨。
    - 铜 9 段 + 0 孔（B 3 / F 15）；死铜删 2 段/孔；口岸切口 5 处、走线出口 6 处；削剩残迹留 3 段（其余丢掉——残迹长度只是窗口参数的函数、不是人的设计）；铺铜带走
      0 张（本板两张都是平面网，按「块内不带铺铜」整张删，拼板时重铺）。
    - 块里 2 个平面网焊盘一根铜都没有（源板就靠铺铜连它），拼板时由整板铺铜接上——DRC 的未连通条数就是它们。
    - GND 裂成 2 个铜岛（没铺铜的必然结果：每颗件的接地脚各自一小块铜），拼板时由整板铺铜接上。
    - kicad-cli DRC：isolated_copper 0；未连通 1 条，**全是 GND**（2 个焊盘点名）——源板靠铺铜接地，块里没铺铜，拼板时由整板铺铜接上；断头走线 5 + 悬空过孔
      1 处就是"口岸切口"（铜走到窗口边就停 = 块的铜接口，留着）；源板基线：未连通 0 / isolated_copper 0 / 违规 248 条。
