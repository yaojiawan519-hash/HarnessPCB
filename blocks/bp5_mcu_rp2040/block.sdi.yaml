    provenance:
      basis: 18 件 / 46 网 / 端口 40 + 轨 2；铜 274 段 + 41 孔；死铜删 43；口岸切口 38
      source: human:open-source
      board: Bus Pirate 5 主板 REV10A（`bus_pirate_pcb/5-REV10A`）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
    geometry_status: extracted 2026-10-30 kicad 10.0.5（PCB 从整板 `REV10a.kicad_pcb` 扣，4 层板； 件在板上转 45°，QFN-56
      0.4mm 节距）
    notes:
    - '**RP2040 主控整簇**：U103 = `RP2040-QFN-56`（7×7mm、**0.4mm 节距**，板上转 45°）+ 18 件 / 46 网 / 端口 40 + 轨 `+3V3`/`GND`
      / 内部网 4 条（`+1V1` + 3 条无名）。'
    - '**去耦是按"数量对得上脚"配的，不是按板面距离**：`+3V3` 上 9 只电容对 U103 的 9 只电源脚（1/10/22/26/33/42/44/48/49）；内核轨 `+1V1`
      三只（C107 2.2µF + C117/C118 0.1µF）对 23/45/50。C113 离 NAND 只有 6.3mm、离 U103 9.7mm，仍属本块。'
    - '**ADC 供电是 RC**：`U103.43 (ADC_AVDD)` ← R103 200R ← `+3V3`，C109 2.2µF 落地 = 无名网 `_bp5_mcu_rp2040_N3`。**晶振是
      12MHz + 两只 15pF**（Y101，3225 封装；`N1` = `U103.20 + Y101.1 + C105.1`，`N2` = `U103.21 + Y101.3 + C106.1`）。'
    - '**端口 40 条的构成**：8 只 `BUFDIR0..7` + 8 只 `BUFIO0..7`（去 `bpu-iobufffer` 那页的缓冲器）、`QSPI_SCLK/SD0..3/SS`
      六根（去 `bp5_qspi_flash`）、`SPI_CLK/CDI/CDO`+`SD_CS`（去 `bp5_spi_nand`）、`USB_D±`（去 `bp5_usb_c_port`）、`SWDIO/SWCLK`（去
      `bp5_swd_header`）、`BUTTONS`（去 `bp5_user_button`），外加 9 根去向网：`AMUX_OUT`/`DISPLAY_CS`/`DISPLAY_DP`/`RGB_CDO`/`SHIFT_EN`/`SHIFT_LATCH`
      → `IO-expand-595-mux` 那页，`CURRENT_ADJ_MCU`/`CURRENT_SENSE`/`VREG_ADJ_MCU` → `bpu-current_limiter`
      那页。'
    - ⚠ **别按"两根腿才算连接"判端口**：上面 16 根 `BUFDIR*/BUFIO*` 和后面 9 根去向网在**本页上全只有一条腿**（各只落在 U103 的一个脚上，共 25 根），它们靠**全局标签**跨页——判据是"同目录别的页有没有同名全局标签"，代码在
      `sdi/block_sch.py` 的 `external_globals()`。不认这条规则，这 25 根会全落进内部网（端口 15 / 内部网 29）。
    - '**复用要点**：这是"最小可跑 RP2040"的中枢，但要配 `bp5_qspi_flash`（QSPI 六根全在板上走）才起得来；`bp5_usb_c_port` + `bp5_ldo_3v3`
      给电，`bp5_swd_header` 给调试，`bp5_user_button` 给 BOOTSEL。'
    - ⚠ **`counts.borrowed_pads` 20 处**：信号 14 条（`AMUX_OUT→R406.2/R407.2`、`CURRENT_SENSE→U601.4`、`DISPLAY_CS→LCD201.8`、`DISPLAY_DP→LCD201.7`、`QSPI_SD0→U102.5`、`SPI_CDO→U105.5`、`RGB_CDO→U503.7`…），即这些铜端**正好压在别的块的焊盘上换层/续接**。块单看是断的，拼板时那几只件插上就通。
    - '**铜**：391 段 + 54 孔、**0 张铺铜**；孤立铜删 43 段/孔；口沿被窗口截断 38 处（留着，拼板时按端口名从焊盘重新引）；残迹留 0。`naked_plane_pads`
      23（GND 脚全靠整板铺铜），`island_split` `GND×27` + `+3V3×2`——**这只块单看 GND/+3V3 是碎的**，拼板整板重铺后并起来。'
