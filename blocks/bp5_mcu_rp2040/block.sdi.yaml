      anchor: U103
      max_mm: 22.0
      rationale: 18 件摊开 20×15mm 左右（板面 x 123.1~143.5、y 75.2~90.4），U103 在中间： 晶体 Y101 在它右下 7.6mm 处（也转 45°），去耦围成一圈。这是作者的布局事实，
        不是这 18 只自己要这么大——QFN-56 的扇出把周围一圈都占了。
