project:
  kind: block
  name: bp5_mcu_rp2040
  version: sdi/1
defs:
  bp5_mcu_rp2040:
    category: mcu
    rationale: '**RP2040 主控整簇**：U103（`RP2040-QFN-56`，7×7mm、0.4mm 节距）+ 它的 9 只 `+3V3` 去耦（C108 2.2µF + C110/C111/C112/C113/C114/C115/C116/C121
      各 0.1µF，**正好对上 RP2040 的 9 只 IOVDD 系电源脚** 1/10/22/26/33/42/44/48/49）+ 内核轨 `+1V1` 三只 （C107 2.2µF、C117/C118
      0.1µF，对应脚 23/45/50）+ ADC 供电的 RC（R103 200R 串、 C109 2.2µF 落地，`Net-(U103-ADC_AVDD)`）+ 12MHz 晶振 Y101
      与两只 15pF 负载电容 （C105/C106，`Net-(U103-XIN/XOUT)`）。18 件 / 46 网。 ⚠ **去耦按"数量对得上脚"归属，不按板面距离**：C113 离 NAND
      只有 6.3mm、离 MCU 9.7mm， 但 `+3V3` 上恰好 11 只电容 = 本块 9 只 + flash 一对（0.1µF+2.2µF），这才是作者的口径。 复用要点：这簇是"最小可跑
      RP2040"——QSPI flash 与 SPI NAND 各自成块，接上 `bp5_qspi_flash` / `bp5_spi_nand` / `bp5_usb_c_port` / `bp5_swd_header`
      才是完整最小系统。'
