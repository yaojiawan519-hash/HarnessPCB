project:
  kind: block
  name: bp5_rgb_leds
  version: sdi/1
defs:
  bp5_rgb_leds:
    category: io
    rationale: '**RGB 状态灯链**：18 颗 SK6812（自带驱动 IC 的可寻址 RGB），一条 DO→DI 菊花链， 链首串 `R502`（1K 0402，数据线限流/阻尼）接跨页端口
      `LEDS_CDO`；每颗灯一只 0.1µF 就近跨 `+VUSB`/`GND`。37 件 / 22 网。电气上极简，价值在**画法与实物**：这是全库唯一一条 "同一电路复制 18 份、链序决定行为"的块，正好用来验"块内重复单元"这条复用路径。
      ⚠ **两种封装、脚序相反**（换料别混）：`SK6812-mini-e` 1=VDD 2=DO 3=GND 4=DI（10 颗， 顶面）；`SK6812-side-a_b` 1=GND 3=VDD
      2=DO 4=DI（8 颗，侧发光，沿板边照光）。 ⚠ **链是有序的**，顺序错了灯串不出图：719→707→713→715→716→717→718→714→712→710→ 708→706→702→701→704→703→705→720（720.DO
      悬空 = 链尾，`unconnected-(LED720-DO)`）。 链序不是从图上推的，是从板上 `Net-(LEDxxx-DI)` 网名逐个对出来的。 ⚠ **灯沿整板四周铺开**（侧发光要贴板边），所以块框
      60.7×60.4mm 几乎就是整板， 内部全是空的——这是"用面积换外观"的设计，不是布局松散。 ⚠ **块内不带铺铜**：18 颗灯的地和 5V 原本靠整板铺铜连（22 个 GND 脚没有走线可达），
      拼板时必须重铺，否则这些脚悬空（`naked_plane_pads` 有账）。'
    ports:
    - name: LEDS_CDO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R502-1
        connector: false
      pin: R502/1
      note: 链首数据入口（经 R502 进 LED719.DI）；该网在 `IO-expand-595-mux` 页以 `shape output` 出现，输出侧不在本块
    rails:
    - +VUSB
    - GND
