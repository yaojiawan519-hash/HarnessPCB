    placement_prior:
      anchor: Q3
      max_mm: 16.0
      rationale: 15 件铺满 23.85×32.13mm，是全库密度最高的一块，分三条带： 中间是**功率链**（Q3 3.23~4.77mm 内挤着 R13 / D4 / D9 / D10，D3
        7.21mm 在 LED 串尽头）， 左上 U5 + C7/C8 组成驱动侧（U5 11.94mm），左侧一列是**电流档电阻 + J3** （J3 6.54mm、R6 9.77、R11
        10.26），下方 C3/C6 是储能（9.18 / 15.75mm）。 要保住的是"基极钳位二极管贴着 Q3 基极、发射极电阻到 J3 路径短、储能电容贴着 LED 串的 VOUT 端"——这三条一散，脉冲边沿和电流精度就都变了。
    slots: []
    hot_loop: []
