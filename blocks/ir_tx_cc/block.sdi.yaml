project:
  kind: block
  name: ir_tx_cc
  version: sdi/1
defs:
  ir_tx_cc:
    category: actuator
    rationale: '**恒流红外发射头**：一路 IO4 进来，经 U5 推一颗 MMBT4401，串两只 5mm 红外 LED 打出去。逐段说： ① **U5 AiP74LVC1T45**（SC-70-6）：VCCA
      与 VCCB 都接 VOUT、DIR 接地（页上注记 "DIR=GND=B Input"，B 侧进 A 侧出）——两侧同电位，所以它**不是电平转换**， 是把 IO4 的驱动能力放大到几十
      mA 去拉基极的缓冲器； ② **基极钳位**：R3 330R 从 U5 输出到 Q3 基极，D9 + D10 两只 1N4148WS 串联从基极到地， 把基极钉在 ≈2×0.65 = 1.3V——这一层钳位让发射极落在
      ≈0.6V，**电流由发射极电阻定、 不由输入电压定**，这才是"恒流"两个字的来源； ③ **三档电流用跳线选**：Q3 发射极接 J3（2x03 1.27mm）的三个偶数脚（2/4/6 连在一起），
      三个奇数脚各经 R6 1R2 / R11 3R0 / R13 6R8 到地。按 Vb≈1.3V、Vbe≈0.75V 估 ⇒ 约 **0.46A / 0.18A / 0.08A** 三档（真实值随器件与温度漂）。
      ⚠ **一次只插一个跳线帽**：偶数脚是共的，插两个等于把两颗电阻并联，电流反而更大； ④ **LED 串**：VOUT → D3 → D4 → Q3 集电极，两只串联（总正向压降 ~3V），
      脉冲电流由 C6 100µF（3528 钽）+ C3 4.7µF 在 VOUT 上就近供给，C7/C8 0.1µF 是 U5 两侧去耦。 复用要点：① 0.46A 那档是**脉冲用**，占空比要按所用
      LED 的 datasheet 卡住， 直流长亮会烧；② 大电流那段原板靠 F.Cu 内部网载流铺铜（本块自带 5 张）， 拼板时别把它们当"多余铺铜"删掉；③ 两只 LED 要开孔/朝外，型号可换成其它
      940nm 5mm 红外管，注意正向压降与串联只数匹配 VOUT；④ 换 3.3V 供电时两只串联压降 会顶到轨，得改成一只或换低 Vf 管。'
    ports:
    - name: IO4
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U5-4
        connector: false
      pin: U5/4
      note: 发射输入：高电平点亮（经块内 U5 缓冲 → R3 → Q3 基极）
    - name: VOUT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: C3-1
        connector: false
      pin: C3/1
      note: 5V 供电 + 脉冲储能（C6 100µF / C3 4.7µF 在块内）
    rails:
    - GND
    parts:
    - ref: D9
      lib: Diode:1N4148W
      value: 1N4148WS
      footprint: Diode_SMD:D_SOD-323F
    - ref: D3
      lib: Device:LED
      value: TSAL6100
      footprint: LED_THT:LED_D5.0mm_Horizontal_O1.27mm_Z3.0mm_IRGrey
    - ref: C6
      lib: Device:C_Polarized_Small
      value: 100uF
      footprint: Capacitor_Tantalum_SMD:CP_EIA-3528-21_Kemet-B_Pad1.50x2.35mm_HandSolder
    - ref: Q3
      lib: Device:Q_NPN_BEC
      value: MMBT4401LT1G
      footprint: Package_TO_SOT_SMD:SOT-23
    - ref: J3
      lib: Connector_Generic:Conn_02x03_Odd_Even
      value: Conn_02x03_1.27mm
      footprint: Connector_PinHeader_1.27mm:PinHeader_2x03_P1.27mm_Vertical
    - ref: R3
