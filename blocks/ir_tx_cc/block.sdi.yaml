    provenance:
      source: human:open-source
      board: Bus Pirate 5 IR Toy 适配板（3REV3）
      license: MIT — 上游 Copyright (c) 2023 Ian Lesnet / Where Labs LLC
      license_tier: permissive
      author: Dangerous Prototypes（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 15 件 / 12 网 / 端口 2 + 轨 1；铜 69 段 + 4 孔；死铜删 29；口岸切口 1；DRC isolated_copper 0；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 bp5-ir-toy-v3-rev3.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板 GND 铺铜按"块内不带铺铜"整张删掉，拼板时由整板铺铜接上）'
    notes:
    - 15 件 / 12 网，但只有 3 张有名字：IO4 输入、VOUT 供电、GND。其余 9 张全是块内无名网（基极钳位节点、LED 串、发射极三档电阻、J3 各脚），卡里统一登记为块内网，拼装时逐实例改名（两份同块否则会把发射极电阻并联）。
    - '**U5 AiP74LVC1T45** 两侧 VCC 都接 VOUT、DIR 接地 ⇒ 它不干电平转换，只当缓冲：把 IO4 的驱动能力放大到能拉几百 mA 级的基极电流。'
    - '**恒流是怎么来的**：D9+D10 两只 1N4148WS 串联把基极钉在 ≈2×0.65 = 1.3V ⇒ 发射极≈0.6V ⇒ 电流由发射极电阻定，不由输入电压/占空比定。三档按 Vbe≈0.75V
      估：R6 1R2 ≈ **0.46A**、R11 3R0 ≈ **0.18A**、R13 6R8 ≈ **0.08A**，真实值随器件与温度漂。'
    - ⚠ **一次只插一个跳线帽**：J3 三个偶数脚（2/4/6）是共的，插两个等于把两颗发射极电阻并联，电流反而变大——它不是互锁的三选一。
    - '**LED 串**：VOUT → D3 → D4 → Q3 集电极，两只 5mm 红外管串联（正向压降合计 ~3V），脉冲电流由 C6 100µF（3528 钽）+ C3 4.7µF 就近供给，C7/C8
      0.1µF 是 U5 两侧去耦。'
    - ⚠ 0.46A 那档是**脉冲用**：占空比要按所用 LED 的 datasheet 卡住，直流长亮会烧；换 3.3V 供电时两只串联的正向压降会顶到轨，得改成一只或换低 Vf 管。
    - ⚠ 5 张**内部网载流铺铜**跟着块走（`_ir_tx_cc_N1/N5/N6/N7/N8`）：这是"块内不带铺铜"的唯一例外——它们不是地/电源平面，是 0.46A 脉冲那一段的铜，拼板时别当多余铺铜删掉。
    - 铜 69 段 + 4 孔（B 9 / F 68）；死铜删 29 段/孔；口岸切口 1 处、走线出口 2 处；削剩残迹留 0 段（其余丢掉——残迹长度只是窗口参数的函数、不是人的设计）；铺铜带走
      5 张（GND 铺铜按「块内不带铺铜」整张删掉；本块留下的都挂在内部网上，是载流铜）。
    - 块里 5 个平面网焊盘一根铜都没有（源板就靠铺铜连它），拼板时由整板铺铜接上——DRC 的未连通条数就是它们。
    - GND 裂成 8 个铜岛（没铺铜的必然结果：每颗件的接地脚各自一小块铜），拼板时由整板铺铜接上；**VOUT 裂成 3 个铜岛**（各含焊盘）：源板上 VOUT 是经块外干线绕过去连的，窗口把它切断了——这是口岸网，装板时由块外干线接上。
    - 借道块外器件焊盘换层 6 处（IO4->J2.6、VOUT->R12.2、VOUT->R2.2、VOUT->R4.2、VOUT->R5.2、VOUT->R7.2）——那孔不在块里，块单看这几处是断的，拼板时插上就通。
    - kicad-cli DRC：isolated_copper 0；未连通 9 条（GND×14、VOUT×4）；断头走线 3 + 悬空过孔 7 处就是"口岸切口"（铜走到窗口边就停 = 块的铜接口，留着）；源板基线：未连通
      0 / isolated_copper 0 / 违规 113 条。
