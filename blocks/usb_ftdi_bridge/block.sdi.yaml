    placement_prior:
      anchor: U3
      max_mm: 16.0
      rationale: 以 FT232H 为中心分三圈。第一圈 2.5~5.8mm：R3 12K（2.51，参考电阻必须贴）、 C12 3.20、C27 4.31、C7 5.79、C13 5.83；第二圈
        6.4~8.2mm：三颗铁氧体与它们的 电容 FB1 6.44 / C8 6.47 / C4 6.49 / C28 7.04 / C9 7.08 / C2 7.29 / C1 8.21；
        第三圈 8.7~11.1mm：两个 USB 跳线 SJ36 8.72 / SJ35 8.91、VBUS 铁氧体 FB3 11.14。 USB-C 座 J1 在 13.56mm、它的去耦 C25
        15.12mm。 判据：**参考电阻与三组滤波电容必须贴脚**（这是 FT232H 能不能跑高速的唯一几何条件）， 而座子离得远近是机械问题（座子必须贴板边），照抄 13.56mm 没有意义。
