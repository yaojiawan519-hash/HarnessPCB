project:
  kind: block
  name: usb_ftdi_bridge
  version: sdi/1
defs:
  usb_ftdi_bridge:
    category: interface
    rationale: USB-C 座（J1 47589-0001）+ FT232H（U3，QFN-48 带 6.2×6.2 散热盘）组成的下载器。 电源这条线是三段滤波不是一段：VBUS 先过 FB3
      铁氧体成 +5VD，FT232H 自己再用三组 铁氧体+电容造内部电源——FB1+C12/C27 给 PHY（V_PHY）、FB2+C13/C28 给 PLL（V_PLL）、 C7/C8/C9
      给 IO 与内核（FT_VCORE 由芯片内部稳压器出）。R3 12K 是 FT232H 的 USB 参考电阻（决定全速还是高速）。 出块 12 个信号：USB_P/USB_M（**同一对 USB
      线经 SJ35/SJ36 两个短路跳线直通 FPGA**， tinyFPGA 引导模式用）、CDONE/CRESET_N（控制 FPGA 配置）、CLK_12M_FT（12MHz 时钟源， 来自时钟块）、EE_CLK/EE_CS/EE_DAT（Microwire
      EEPROM）、FT_SCK/FT_SSn/ FLASH_MISO/FLASH_MOSI（SPI）。 12 个 TP1~TP12 是这块的调试口，不是装饰：USB D±、3V3、GND、SPI
      四线全引出来了。 复用要点：USB_P/USB_M 走跳线而不是直连，是为了让 FPGA 在错误状态下不打扰下载器； 换板若不需要"FPGA 直接当 USB 设备"，SJ35/SJ36 就是该删的两个件。
    ports:
    - name: CDONE
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-19
        connector: false
      pin: U3/19
      note: 配置完成，回读给 FT232H 的 U3.19
    - name: CLK_12M_FT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-1
        connector: false
      pin: U3/1
      note: 12MHz 输入（源在 clock_12m 的 U4.3）
    - name: CRESET_N
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-20
        connector: false
      pin: U3/20
      note: 配置复位，由 U3.20 驱动
    - name: EE_CLK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-44
        connector: false
      pin: U3/44
      note: Microwire EEPROM 时钟（93LC56）
    - name: EE_CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-45
        connector: false
      pin: U3/45
      note: Microwire EEPROM 片选
    - name: EE_DAT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-43
        connector: false
      pin: U3/43
      note: Microwire EEPROM 数据（双向）
    - name: FLASH_MISO
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-15
        connector: false
      pin: U3/15
      note: SPI 数据入 U3.15
    - name: FLASH_MOSI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-14
        connector: false
      pin: U3/14
      note: SPI 数据出 U3.14
    - name: FT_SCK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-13
        connector: false
      pin: U3/13
      note: SPI 时钟出 U3.13
    - name: FT_SSn
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U3-17
        connector: false
      pin: U3/17
      note: SPI 片选出 U3.17
    - name: USB_M
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J1-2
        connector: true
      pin: J1/2
      note: USB D-，经 SJ36 短路跳线直通 FPGA（同上）
    - name: USB_P
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J1-3
        connector: true
      pin: J1/3
      note: USB D+，经 SJ35 短路跳线直通 FPGA（tinyFPGA 引导模式用）
    rails:
    - +3V3
    - +5VD
    - GND
