project:
  kind: block
  name: epaper_driver
  version: sdi/1
defs:
  epaper_driver:
    category: interface
    rationale: 墨水屏整套接口：J3 是 24 脚 0.5mm FPC 座（SPI 的 SCK/MOSI/CS/DC/RES/BUSY 加电源与 两组栅极轨），其余是**自举出 ±高压**的电荷泵——L2
      47uH 从 +3V3 进，Q3(AO3400A) 做开关管， R17 2.2Ω 是它的源极采样电阻（RESE 网就是靠这颗量电流的），R16 1M 把栅极 GDR 下拉； D5(MBR0530)
      + C22 出 PREVGH（正轨），D3/D4 背靠背 + C29/C21 出 PREVGL（负轨）。 C23~C28 六颗 1uF/50V 是屏侧的储能/滤波（J3 的 5/18/20/22/24
      各挂一颗）。 R19 100K 是 RES 的下拉。**这是一块高压区**：±20V 上下的轨就在这几颗电容上。
    ports:
    - name: BUSY
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-9
        connector: true
      pin: J3/9
      note: 屏忙
    - name: CS
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-12
        connector: true
      pin: J3/12
      note: 片选
    - name: DC
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-11
        connector: true
      pin: J3/11
      note: 数据/命令
    - name: MOSI
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-14
        connector: true
      pin: J3/14
      note: SPI 数据
    - name: RES
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-10
        connector: true
      pin: J3/10
      note: 屏复位（R19 100K 下拉）
    - name: SCK
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: J3-13
        connector: true
      pin: J3/13
      note: SPI 时钟
    rails:
    - +3V3
    - GND
    parts:
    - ref: J3
      lib: Connector_Generic:Conn_01x24
