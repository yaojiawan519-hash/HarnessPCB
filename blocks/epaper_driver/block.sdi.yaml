    placement_prior:
      anchor: J3
      max_mm: 30.0
      rationale: 理想口径是"开关回路最小"：L2、Q3、D3/D4/D5 与升压电容围成一小圈，采样电阻 R17 贴 Q3 源极。**源板没这么摆**：Q3 离 L2 21.66mm、离
        D5 23.25mm、离 R17 12.63mm，电荷泵被 拆在两端——复用时要按最小回路重摆，别照抄这个距离。J3 贴板边、开口朝外。
    slots: []
    hot_loop: []
