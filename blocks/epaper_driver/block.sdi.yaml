      license_tier: permissive
      author: SQFMI（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 19 件 / 19 网 / 端口 6 + 轨 2；铜 129 段 + 9 孔；死铜删 34；口岸切口 8；DRC isolated_copper 0；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 Watchy.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板的铺铜按"块内不带铺铜"整张删掉）'
    notes:
    - 19 件 / 19 网，6 个 SPI 口岸 + 轨 +3V3/GND；PREVGH/PREVGL/GDR/RESE 是**块内网**——±高压是这块自己造出来的，不出块。
    - J3 的 24 脚里 1/4/6/7/19 五个空脚，按"空脚不是网"不写进卡。
    - ⚠ 电荷泵回路在源板上很不紧凑：开关管 Q3 离电感 L2 21.66mm、离升压二极管 D5 23.25mm、离采样电阻 R17 12.63mm。这是高压开关回路，复用时必须按最小回路重摆，照抄这个距离会出
      EMI/振铃。
    - 4 层板：F.Cu 97 / In2.Cu 25 / B.Cu 2 段 + 17 过孔；内层 GND 平面按规矩删掉，拼板重铺时 In2 不能再整层铺铜。
    - 死铜删 34 段/孔，口岸切口 8 处，DRC isolated_copper 0。
