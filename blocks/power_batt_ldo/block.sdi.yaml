      author: SQFMI（上游）/ HarnessPCB（裁块）
      date: '2026-10-30'
      kicad: 10.0.5
      basis: 19 件 / 12 网 / 端口 5 + 轨 3；铜 294 段 + 33 孔；死铜删 86；口岸切口 26；DRC isolated_copper 0；卡↔板门 ①~⑤ 全过
    geometry_status: 'extracted 2026-10-30 kicad 10.0.5（PCB 从 Watchy.kicad_pcb 原样扣，坐标 = 源板坐标平移，origin:
      page；源板的铺铜按"块内不带铺铜"整张删掉）'
    notes:
    - 12 条网：+BATT 是块内网（电池节点只在块内），VBUS/+3V3/GND 是轨，EN/BTN2/BTN3/STAT/ADC 是 5 个信号口岸。
    - U1(SR2HARU) 6 脚，上游没给用途说明，这里只按网表说话：它接 EN、BTN2、BTN3 与 +3V3/GND，是这两颗键与使能之间的控制件。换板复用时这三个口岸要一起接，只接 EN
      不管键，等于把它晾在中间。
    - 源板 4 层：F.Cu / In1.Cu / In2.Cu / B.Cu，内层只有一张填好的 GND 平面（In1+In2 同一张 zone）和五张没填的残留 zone。按"块内不带铺铜"整张删掉，块里
      0 张铺铜——拼板时由整板铺铜接上。
    - 块内铜：F.Cu 142 段 / In2.Cu 68 段 / B.Cu 50 段 + 30 过孔。⚠ In2 在源板既是平面层又是走线层，块里保留了 68 段 In2 走线——拼板重铺平面时
      In2 不能再整层铺铜（会被走线切开、同层短路），要么只在 In1 铺，要么换叠层。
    - 死铜删 86 段/孔（只服务块外器件的 GND/+3V3 干线），口岸切口 26 处。kicad-cli DRC：isolated_copper 0。
