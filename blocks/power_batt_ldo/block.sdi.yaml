project:
  kind: block
  name: power_batt_ldo
  version: sdi/1
defs:
  power_batt_ldo:
    category: power
    rationale: 电池 + USB 两路输入的整条电源链。U3(TP4054，MCP73831 封装) 是线性锂电充电器：VDD=VBUS、 VBAT=+BATT、R3 10K 是 PROG（充电电流约
      1000/10k = 100mA）；STAT 是开漏状态脚，经 R6 100K 串到 MCU 的 STAT 网、再由 R5 51K 上拉到 VBUS——**同一颗灯/同一根线既给 MCU 读状态、
      又能点灯**。Q1(CJ2301 P-MOS) 做电源路径：栅极接 VBUS，插上 USB 时栅极高、Q1 关断， 电池被断开（充电器才能正常工作），同时 D1(MBR0530) 把 VBUS
      送进 LDO；拔掉 USB 后 栅极被 R2 100K 拉到地、Q1 导通，电池供电。U2(RT908033，AP2112K-3.3 封装) 出 +3V3， C4/C5/C6/C10 与 C1/C3
      是输入/输出去耦。R8 100K + R9 360K + C11 100nF 是电池电压分压 （4.2V → 3.29V，正好落在 3.3V ADC 量程内）。U1(SR2HARU) 只有 6
      脚，接在 EN / BTN2 / BTN3 三根网上，是按键与使能之间的控制件。
    ports:
    - name: ADC
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: C11-1
        connector: false
      pin: C11/1
      note: 电池电压分压的中点，R8 100K/R9 360K 把 4.2V 分到 3.29V；MCU 侧 ADC 直接读，别再并电阻
    - name: BTN2
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U1-2
        connector: false
      pin: U1/2
      note: 按键网，同时接进 U1(SR2HARU)——不是纯按键，电源控制也看它
    - name: BTN3
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U1-5
        connector: false
      pin: U1/5
      note: 按键网，同时接进 U1(SR2HARU)，并且是 BOOT 键（TP3 也在这根网上）
    - name: EN
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: U1-3
        connector: false
      pin: U1/3
      note: MCU 使能/复位 RC 的那一侧（R1 10K + C2 1uF 在 MCU 块里）
    - name: STAT
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: R5-2
        connector: false
      pin: R5/2
      note: 充电器开漏状态，R5 51K 上拉到 VBUS、R6 100K 串到 U3 的 STAT 脚
    rails:
    - +3V3
    - GND
    - VBUS
    parts:
    - ref: U3
      lib: Battery_Management:MCP73831-2-OT
      value: TP4054
      footprint: TO_SOT_Packages_SMD:SOT-23-5
    - ref: R3
