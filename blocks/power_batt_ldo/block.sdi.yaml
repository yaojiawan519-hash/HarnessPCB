    placement_prior:
      anchor: U2
      max_mm: 26.0
      rationale: 充电器 U3 贴电池座 J1 一侧，PROG 电阻 R3 紧贴 U3；电源路径 Q1/D1 夹在 VBUS 与 LDO 输入 之间；LDO 输出电容贴 U2 的 OUT
        脚。源板上 LDO→输出电容 2.84mm、U3→R3 3.66mm 是贴脚的， 但 Q1→D1 6.91mm、J1→U3 15.94mm 是作者为了走线让开的距离，不当作约束。
