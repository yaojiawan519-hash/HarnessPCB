project:
  kind: block
  name: bp5_io_expander
  version: sdi/1
defs:
  bp5_io_expander:
    category: io
    rationale: '**IO 扩展 + 电平转换**：两片 74HC595（U501/U502）串成 16 位移位输出（QB 串到下一片 SER）， 74HCT245（U503）把 3.3V
      逻辑抬到 5V 去驱动后级。⚠ 型号不能换：595 必须是 **HC** 不能是 HCT （它跑 3.3V），245 必须是 **HCT** 不能是 HC（它跑 5V）。245 的 A 侧接
      595、B 侧出块： B7=PULLUP_EN、B6 空、B5=LEDS_CDO、B4 经 R316(510R) 到 AMUX_S0、B3..B0 经 RN315 （510R×4）到 AMUX_S1/S2/S3/AMUX_EN。R501(10K)
      是 SHIFT_EN——两只 595 的 /OE 与 245 的 /OE 共用的上拉，拉低时才输出。三只 100nF（C501/C502/C503）各自就近去耦。 ⚠ **值要现读**：R501/R316
      一开始被按惯例填反（以为上拉是 R316），实际 `(property "Value")` 是 R501=10K（上拉）、R316=510R（串阻），已按现读改正。 ⚠ 这块是**整页的驱动源头**：595
      的 8 条输出经电平转换后几乎连到全板每一个子模块 （显示屏、RGB 灯、电流源、模拟开关），所以端口多达 20 个——不是分块没分好，是它真的 是总线扇出点。'
    ports:
    - name: AMUX_EN
      kind: signal
      class: digital
      direction: bidirectional
      exit:
        pin: RN315-1
        connector: false
