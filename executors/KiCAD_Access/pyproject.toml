[project]
name = "kicad-access"
version = "0.1.0"
description = "KiCad Access — 模块化 PCB 自动化设计工具集（kca）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sexpdata>=1.0.2",
    "pyyaml>=6",
]

[project.scripts]
kca = "kicad_access.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_access"]

[tool.pytest.ini_options]
testpaths = ["tests"]
